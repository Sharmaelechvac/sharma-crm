<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>SHARMA360 CRM</title>
<script>
/* Appearance boot — Sanjay's standing rule for every Sharma app
   (2026-11-19): the app ALWAYS opens in LIGHT mode, even when the
   phone is in dark mode. Dark appears only through the in-app
   Appearance switch and is remembered on this device. The app never
   follows prefers-color-scheme. This runs before the stylesheet so
   the first paint is already correct. */
(function(){
  try {
    var t = localStorage.getItem("sharma-crm-appearance");
    document.documentElement.dataset.theme = (t === "dark") ? "dark" : "light";
  } catch(e){ document.documentElement.dataset.theme = "light"; }
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ LOCK / SETUP / ROLE (shown before the app) ============ -->
<div id="gate"></div>

<!-- ============ APP SHELL ============ -->
<div id="appshell" class="hidden">

  <!-- Sidebar (≥760px) -->
  <aside class="sidebar">
    <div class="wordmark">
      <img class="wm-logo" src="assets/sharma360-logo.png" alt="SHARMA360 — Sharma Electric &amp; HVAC">
      <div class="wm-sub">CRM</div>
    </div>
    <div class="snav-label">Menu</div>
    <nav class="snav">
      <button data-nav="home"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 11.2 12 4.5l7.5 6.7"/><path d="M6.5 9.8V19a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V9.8"/><path d="M10 20v-5h4v5"/></svg></span><span class="lbl">Home</span></button>
      <button data-nav="clients"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.2" r="3.4"/><path d="M3.8 19.2c.7-3 2.8-4.6 5.2-4.6s4.5 1.6 5.2 4.6"/><path d="M15.6 5.3a3.4 3.4 0 0 1-.1 6.1M17.9 14.9c1.3.7 2.2 2 2.6 3.9"/></svg></span><span class="lbl">Clients</span><span class="navcount" id="navcount-clients">0</span></button>
      <button data-nav="quotes"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.8h7L18.5 8.3V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.8a1 1 0 0 1 1-1z"/><path d="M13.8 3.8v4.7h4.7"/><path d="M9.3 13.4h5.4M9.3 16.6h5.4"/></svg></span><span class="lbl">Quotes</span><span class="navcount" id="navcount-quotes">0</span></button>
      <button data-nav="jobs"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.8" y="8" width="16.4" height="11" rx="2"/><path d="M9 8V6.8A2.8 2.8 0 0 1 11.8 4h.4A2.8 2.8 0 0 1 15 6.8V8"/><path d="M3.8 13.2h16.4"/></svg></span><span class="lbl">Jobs</span><span class="navcount" id="navcount-jobs">0</span></button>
      <button data-nav="invoices"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.8h11V20l-1.8-1.3L13.9 20l-1.9-1.3L10.1 20l-1.8-1.3L6.5 20z"/><path d="M9.4 8.6h5.2M9.4 12h5.2"/></svg></span><span class="lbl">Invoices</span><span class="navcount" id="navcount-invoices">0</span></button>
      <button data-nav="more"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.7" fill="currentColor" stroke="none"/></svg></span><span class="lbl">More</span></button>
    </nav>
    <div class="sidefoot">
      <span class="rolechip" id="rolechip">Owner</span>
      <button data-act="switchRole"><span class="fic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 7.5h10.8l-2.8-2.8M17.5 16.5H6.7l2.8 2.8"/></svg></span> Switch role</button>
      <button data-act="lock"><span class="fic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.8" y="10.8" width="12.4" height="9" rx="2"/><path d="M8.8 10.8V8a3.2 3.2 0 0 1 6.4 0v2.8"/></svg></span> Lock CRM</button>
    </div>
  </aside>

  <div class="mainwrap">
    <!-- Top bar: glass chrome. On root tabs the Large Title lives in
         the scroll content; this bar's inline title fades in on scroll
         (core.js toggles .scrolled / .has-largetitle). -->
    <header class="topbar" id="topbar">
      <div class="brand-mini"><img src="assets/sharma360-logo.png" alt="SHARMA360"></div>
      <div id="viewtitle">Home</div>
      <div class="spacer"></div>
      <div class="searchwrap">
        <span class="s-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M15.8 15.8 20.3 20.3"/></svg></span>
        <input type="search" id="globalsearch" placeholder="Search clients, quotes, jobs, invoices…" autocomplete="off" aria-label="Search the CRM">
        <div id="searchresults" class="hidden"></div>
      </div>
      <button class="btn gold" data-act="globalNew" aria-label="Create new"><span class="fic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg></span><span class="btn-new-lbl">New</span></button>
    </header>

    <main id="main"></main>
  </div>

  <!-- Floating glass tab bar (phone) -->
  <nav class="tabbar" id="tabbar">
    <span class="tab-sel" id="tabsel" aria-hidden="true"></span>
    <button data-nav="home"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 11.2 12 4.5l7.5 6.7"/><path d="M6.5 9.8V19a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V9.8"/><path d="M10 20v-5h4v5"/></svg></span>Home</button>
    <button data-nav="clients"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.2" r="3.4"/><path d="M3.8 19.2c.7-3 2.8-4.6 5.2-4.6s4.5 1.6 5.2 4.6"/><path d="M15.6 5.3a3.4 3.4 0 0 1-.1 6.1M17.9 14.9c1.3.7 2.2 2 2.6 3.9"/></svg></span>Clients</button>
    <button data-nav="quotes"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.8h7L18.5 8.3V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.8a1 1 0 0 1 1-1z"/><path d="M13.8 3.8v4.7h4.7"/><path d="M9.3 13.4h5.4M9.3 16.6h5.4"/></svg></span>Quotes</button>
    <button data-nav="jobs"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.8" y="8" width="16.4" height="11" rx="2"/><path d="M9 8V6.8A2.8 2.8 0 0 1 11.8 4h.4A2.8 2.8 0 0 1 15 6.8V8"/><path d="M3.8 13.2h16.4"/></svg></span>Jobs</button>
    <button data-nav="invoices"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.8h11V20l-1.8-1.3L13.9 20l-1.9-1.3L10.1 20l-1.8-1.3L6.5 20z"/><path d="M9.4 8.6h5.2M9.4 12h5.2"/></svg></span>Invoices<span class="tabbadge hidden" id="tabbadge-invoices">0</span></button>
    <button data-nav="more"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.7" fill="currentColor" stroke="none"/></svg></span>More</button>
  </nav>
</div>

<div id="modal-root"></div>
<div id="toast" role="status"></div>

<script src="core.js"></script>
<script src="view-home.js"></script>
<script src="view-clients.js"></script>
<script src="view-quotes.js"></script>
<script src="view-jobs.js"></script>
<script src="view-invoices.js"></script>
<script src="view-more.js"></script>
<script>
/* ---- integration bridges (Jarvis): cross-module deep links + action aliases ---- */
(function(){
  if(typeof ACTIONS === "undefined") return;
  if(ACTIONS.q_new && !ACTIONS.quote_new) ACTIONS.quote_new = ACTIONS.q_new;
  if(ACTIONS.cl_new && !ACTIONS.client_new) ACTIONS.client_new = ACTIONS.cl_new;
  if(ACTIONS.inv_new && !ACTIONS.invoice_new) ACTIONS.invoice_new = ACTIONS.inv_new;
  ACTIONS.openQuote = function(){
    if(typeof selQuoteId !== "undefined" && selQuoteId && ACTIONS.q_open) ACTIONS.q_open({ dataset: { id: selQuoteId } });
    else if(typeof render === "function") render();
  };
  ACTIONS.openInvoice = function(){
    const id = (typeof selInvoiceId !== "undefined") ? selInvoiceId : null;
    if(id && ACTIONS.inv_open) ACTIONS.inv_open({ getAttribute: function(){ return id; } });
    else if(typeof render === "function") render();
  };
  ACTIONS.openJob = function(){
    if(typeof selJobId !== "undefined" && selJobId) window.CRM_OPEN = { tab: "jobs", id: selJobId };
    if(typeof render === "function") render();
  };
  const baseRender = render;
  render = function(){
    const o = window.CRM_OPEN;
    if(o && o.tab === TAB){
      if(o.tab === "quotes" && ACTIONS.q_open){ window.CRM_OPEN = null; ACTIONS.q_open({ dataset: { id: o.id } }); return; }
      if(o.tab === "invoices" && ACTIONS.inv_open){ window.CRM_OPEN = null; ACTIONS.inv_open({ getAttribute: function(){ return o.id; } }); return; }
      if(o.tab === "clients"){ window.CRM_OPEN = null; try { selClientId = o.id; } catch(e){} }
      /* jobs: VIEWS.jobs consumes CRM_OPEN itself */
    }
    baseRender();
  };
})();
</script>
</body>
</html>
