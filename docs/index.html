<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SHARMA360 · CRM — Sharma Electric &amp; HVAC</title>
<style>
  :root{
    --navy:#264387; --navy-dark:#1b3163; --gold:#F0A846; --gold-dark:#c07f1d;
    --ink:#182430; --muted:#5a6b7d; --line:#d7dee6; --bg:#f2f5f9; --card:#ffffff;
    --green:#177245; --red:#b3261e; --amber:#96690a; --blue:#1f6fd6;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{font-size:18px;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg); color:var(--ink); line-height:1.45; padding-bottom:96px;}
  /* ---------- header ---------- */
  header.app{background:var(--navy); color:#fff; padding:16px 18px 14px; position:sticky; top:0; z-index:20;
       box-shadow:0 2px 10px rgba(27,49,99,.35);}
  header.app .row{display:flex; align-items:center; justify-content:space-between; gap:12px; max-width:860px; margin:0 auto;}
  header.app h1{font-size:1.35rem; margin:0; letter-spacing:.5px; font-weight:800;}
  header.app h1 .gold{color:var(--gold);}
  header.app .sub{font-size:.82rem; opacity:.85; margin-top:2px;}
  .hbtns{display:flex; gap:8px; align-items:center;}
  .rolebadge{background:var(--gold); color:#23180a; font-weight:700; font-size:.78rem;
       padding:6px 12px; border-radius:999px; white-space:nowrap;}
  .iconbtn{background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.35);
       border-radius:10px; min-width:48px; min-height:48px; font-size:1.15rem; cursor:pointer;}
  /* ---------- layout ---------- */
  main{max-width:860px; margin:0 auto; padding:16px 14px 8px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
       padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(24,36,48,.05);}
  h2.view{font-size:1.3rem; margin:4px 0 12px; color:var(--navy-dark);}
  h3.sec{font-size:1.05rem; margin:18px 0 8px; color:var(--navy-dark);}
  .muted{color:var(--muted);} .small{font-size:.85rem;}
  .empty{padding:22px 16px; text-align:center; color:var(--muted); border:1.5px dashed var(--line);
       border-radius:var(--radius); background:#fff; margin-bottom:14px;}
  .greet{font-size:1.55rem; font-weight:800; color:var(--navy-dark); margin:2px 0 2px;}
  .greet-sub{color:var(--muted); font-size:.92rem; margin-bottom:14px;}
  /* ---------- buttons & forms ---------- */
  button, .btn{font:inherit; cursor:pointer;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:52px;
       padding:12px 20px; border-radius:12px; border:1px solid var(--navy); background:var(--navy);
       color:#fff; font-weight:700; text-decoration:none; font-size:1rem;}
  .btn.gold{background:var(--gold); border-color:var(--gold-dark); color:#23180a;}
  .btn.ghost{background:#fff; color:var(--navy); border-color:var(--navy);}
  .btn.green{background:var(--green); border-color:var(--green);}
  .btn.red{background:#fff; color:var(--red); border-color:var(--red);}
  .btn.block{display:flex; width:100%; margin:8px 0;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  label.f{display:block; font-weight:600; margin:14px 0 6px; font-size:.95rem;}
  input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],
  input[type=password],select,textarea{
       width:100%; font:inherit; padding:13px 12px; min-height:52px; border:1.5px solid var(--line);
       border-radius:10px; background:#fff; color:var(--ink);}
  textarea{min-height:84px; resize:vertical;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--navy); outline-offset:1px; border-color:var(--navy);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:560px){ .grid2{grid-template-columns:1fr;} }
  /* ---------- list rows ---------- */
  .rowitem{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:#fff;
       border:1px solid var(--line); border-radius:var(--radius); padding:15px 16px; margin-bottom:10px;
       min-height:64px; cursor:pointer; color:var(--ink); font:inherit;}
  .rowitem:active{background:#eef3fa;}
  .rowitem .grow{flex:1; min-width:0;}
  .rowitem .name{font-weight:700; font-size:1.02rem; overflow:hidden; text-overflow:ellipsis;}
  .rowitem .meta{color:var(--muted); font-size:.85rem; margin-top:2px;}
  .rowitem .amt{font-weight:800; white-space:nowrap;}
  .rowitem .amt.owed{color:var(--red);}
  .chev{color:var(--muted); font-size:1.3rem;}
  .avatar{flex:none; width:48px; height:48px; border-radius:50%; background:var(--navy); color:#fff;
       display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.15rem;}
  .avatar.goldbg{background:var(--gold); color:#23180a;}
  .badge{display:inline-block; font-size:.72rem; font-weight:700; letter-spacing:.4px; padding:4px 10px;
       border-radius:999px; background:#e4ebf5; color:var(--navy-dark); text-transform:uppercase; white-space:nowrap;}
  .badge.gold{background:#fdeecb; color:#7a5205;}
  .badge.green{background:#d9efe2; color:var(--green);}
  .badge.red{background:#f9dcd9; color:var(--red);}
  .badge.grey{background:#e8edf2; color:var(--muted);}
  /* status pills (Jobber-style) */
  .pill{display:inline-block; font-size:.72rem; font-weight:800; letter-spacing:.4px; padding:5px 11px;
       border-radius:999px; text-transform:uppercase; white-space:nowrap;}
  .pill.grey{background:#e8edf2; color:var(--muted);}
  .pill.blue{background:#dbeafe; color:#1e50a2;}
  .pill.green{background:#d9efe2; color:var(--green);}
  .pill.navy{background:var(--navy); color:#fff;}
  .pill.red{background:#f9dcd9; color:var(--red);}
  .pill.gold{background:#fdeecb; color:#7a5205;}
  .tag-draft{display:inline-block; background:var(--red); color:#fff; font-weight:800; font-size:.78rem;
       padding:5px 12px; border-radius:8px; letter-spacing:.4px;}
  /* filter chips */
  .chips{display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 4px;}
  .chips button{border:1.5px solid var(--line); background:#fff; color:var(--muted); font-weight:700;
       border-radius:999px; padding:9px 16px; min-height:44px; font-size:.88rem;}
  .chips button.on{background:var(--navy); border-color:var(--navy); color:#fff;}
  /* ---------- today stats / insight cards ---------- */
  .stats{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px;}
  @media (min-width:640px){ .stats{grid-template-columns:repeat(4,1fr);} }
  .stat{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:16px 14px; text-align:center;}
  .stat .n{font-size:1.9rem; font-weight:800; color:var(--navy); line-height:1.1;}
  .stat .l{font-size:.82rem; color:var(--muted); margin-top:4px; font-weight:600;}
  .stat .s{font-size:.85rem; font-weight:700; color:var(--ink); margin-top:2px;}
  button.stat{font:inherit; cursor:pointer; width:100%;}
  button.stat:active{background:#eef3fa;}
  .stat.alert .n{color:var(--red);}
  /* ---------- stages ---------- */
  .stage{border:1px solid var(--line); border-radius:12px; padding:13px 14px; margin-bottom:10px; background:#fff;}
  .stage .top{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .stage .nm{font-weight:700;}
  .segbtns{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
  .segbtns button{flex:1; min-height:48px; padding:9px 6px; border-radius:10px; border:1.5px solid var(--line);
       background:#fff; font-weight:600; font-size:.88rem; color:var(--muted);}
  .segbtns button.on-not{background:#e8edf2; color:var(--ink); border-color:var(--muted);}
  .segbtns button.on-sched{background:#fdeecb; color:#7a5205; border-color:var(--gold-dark);}
  .segbtns button.on-done{background:var(--green); color:#fff; border-color:var(--green);}
  .stage input[type=date]{margin-top:10px;}
  /* ---------- line items ---------- */
  .linerow{display:grid; grid-template-columns:1fr 74px 110px 44px; gap:8px; margin-bottom:8px; align-items:center;}
  .linerow input{min-height:48px; padding:10px;}
  .linerow .del{min-height:48px; border-radius:10px; border:1.5px solid var(--red); background:#fff; color:var(--red); font-size:1.05rem;}
  table.lines{width:100%; border-collapse:collapse; margin:8px 0;}
  table.lines th, table.lines td{padding:9px 6px; border-bottom:1px solid var(--line); text-align:left; font-size:.95rem;}
  table.lines th{color:var(--muted); font-size:.8rem; text-transform:uppercase; letter-spacing:.4px;}
  table.lines td.num, table.lines th.num{text-align:right; white-space:nowrap;}
  .totalrow{display:flex; justify-content:space-between; font-size:1.15rem; font-weight:800; padding:10px 2px; color:var(--navy-dark);}
  .balrow{display:flex; justify-content:space-between; font-size:1.05rem; font-weight:800; padding:8px 2px; color:var(--red);}
  /* ---------- tab bar ---------- */
  nav.tabs{position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1.5px solid var(--line);
       display:flex; z-index:30; padding-bottom:env(safe-area-inset-bottom); box-shadow:0 -2px 12px rgba(24,36,48,.08);}
  nav.tabs button{flex:1; background:none; border:none; padding:12px 2px 13px; font-size:.8rem; font-weight:700;
       color:var(--muted); min-height:62px; cursor:pointer;}
  nav.tabs button .ic{display:block; font-size:1.35rem; margin-bottom:2px;}
  nav.tabs button.on{color:var(--navy);}
  nav.tabs button.on .ic{color:var(--gold-dark);}
  /* ---------- lock / setup ---------- */
  .lockwrap{max-width:440px; margin:0 auto; padding:34px 18px;}
  .lockcard{background:#fff; border:1px solid var(--line); border-radius:18px; padding:26px 22px;
       box-shadow:0 6px 24px rgba(27,49,99,.12); text-align:center;}
  .lockcard .brand{font-size:1.5rem; font-weight:800; color:var(--navy); letter-spacing:.5px;}
  .lockcard .brand .gold{color:var(--gold-dark);}
  .lockcard .sub{color:var(--muted); font-size:.9rem; margin:4px 0 8px;}
  .err{background:#f9dcd9; color:var(--red); border-radius:10px; padding:11px 13px; margin:12px 0; font-weight:600; display:none;}
  .okmsg{background:#d9efe2; color:var(--green); border-radius:10px; padding:11px 13px; margin:12px 0; font-weight:600; display:none;}
  .rolebtn{display:flex; width:100%; align-items:center; gap:14px; text-align:left; background:#fff;
       border:2px solid var(--navy); border-radius:14px; padding:18px; margin:10px 0; min-height:76px; cursor:pointer; font:inherit;}
  .rolebtn .ic{font-size:1.7rem;}
  .rolebtn .t{font-weight:800; font-size:1.1rem; color:var(--navy-dark);}
  .rolebtn .d{color:var(--muted); font-size:.85rem;}
  .hidden{display:none !important;}
  .backbtn{background:none; border:none; color:var(--navy); font-weight:700; font-size:1rem;
       padding:10px 4px; min-height:48px; cursor:pointer;}
  .kv{display:flex; justify-content:space-between; gap:14px; padding:7px 0; border-bottom:1px solid #eef1f5;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--muted); font-size:.9rem;} .kv .v{font-weight:600; text-align:right;}
  .followup{border-left:5px solid var(--gold); }
  .followup.red{border-left-color:var(--red);}
  .cathead{font-size:.95rem; font-weight:800; color:var(--navy-dark); margin:18px 0 8px; text-transform:uppercase; letter-spacing:.5px;}
</style>
</head>

<!-- ============ LOCK / SETUP / ROLE (shown before the app) ============ -->
<div id="gate"></div>

<!-- ============ APP SHELL ============ -->
<div id="appshell" class="hidden">
  <header class="app">

</div>

/* ---------------- utilities ---------------- */
const $ = (sel, el) => (el || document).querySelector(sel);
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtDate(iso){
  if(!iso) return "—";
  const p = String(iso).split("-");
  if(p.length !== 3) return esc(iso);
  return MONTHS[parseInt(p[1],10)-1] + " " + parseInt(p[2],10) + ", " + p[0];
}
function daysBetween(fromIso, toIso){
  const a = new Date(fromIso + "T12:00:00"), b = new Date(toIso + "T12:00:00");
  return Math.round((b - a) / 86400000);
}
const USD = new Intl.NumberFormat("en-US", {style:"currency", currency:"USD"});
function money(n){ return USD.format(Number(n) || 0); }
function typeLabel(t){ t = String(t || "builder").toLowerCase(); return t === "builder" ? "Builder" : (t === "homeowner" ? "Homeowner" : (t === "commercial" ? "Commercial" : "Builder")); }
function djb2(str){
  let h = 5381;
  for(let i = 0; i < str.length; i++){ h = ((h << 5) + h + str.charCodeAt(i)) | 0; }
  return String(h >>> 0);
}

/* ---------------- data store ---------------- */
let DB = null;
function blankDB(){
  return {
    passHash: null,
    clients: [],
    quotes: [],
    jobs: [],
    invoices: [],
    requests: [],
    seq: { quote: 1001, invoice: 1001, client: 41 },
    importStamp: null,
    importInfo: null
  };
}
function loadDB(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ DB = JSON.parse(raw); return; }
  } catch(e){ /* corrupted storage falls through to a fresh DB */ }
  DB = blankDB();
}
function saveDB(){ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
function seedIfNeeded(){
  if(!DB.clients || DB.clients.length === 0){
    DB.clients = JSON.parse(JSON.stringify(SEED_CLIENTS));
  }
  if(!DB.quotes) DB.quotes = [];
  if(!DB.jobs) DB.jobs = [];
  if(!DB.invoices) DB.invoices = [];
  if(!DB.requests) DB.requests = [];
  if(!DB.seq) DB.seq = { quote: 1001, invoice: 1001, client: 41 };
  DB.clients.forEach(c => {
    if(!("phone" in c)) c.phone = "";
    if(!("email" in c)) c.email = "";
    if(!("billingNotes" in c)) c.billingNotes = "";
    if(!Array.isArray(c.contacts)) c.contacts = [];
    if(!Array.isArray(c.properties)) c.properties = [];
  });
  /* migrate Stage A records to the Jobber-style shape */
  DB.invoices.forEach(inv => {
    if(!Array.isArray(inv.payments)){
      inv.payments = [];
      if(inv.payment){
        inv.payments.push({ date: inv.payment.date || inv.createdAt, method: inv.payment.method || "",
          ref: inv.payment.ref || "", amount: Number(inv.amount) || 0 });
        delete inv.payment;
      }
    }
    const mapped = mapInvoiceStatus(inv.status);
    if(mapped === "Past due"){ inv.status = "Sent"; inv.pastDue = true; }
    else if(mapped){ inv.status = mapped; }
  });
  DB.quotes.forEach(q => { if(!("title" in q)) q.title = ""; q.status = mapQuoteStatus(q.status) || q.status; });
  DB.jobs.forEach(j => { if(!j.stages) j.stages = blankStages(); });
  DB.requests.forEach(r => { if(!r.status) r.status = "New"; });
}

/* ---------------- passcode (SHA-256) ---------------- */
async function sha256(text){
  if(window.crypto && crypto.subtle){
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  }
  /* Fallback for non-secure contexts only (rare): a simple non-crypto hash. */
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i = 0; i < text.length; i++){
    const ch = text.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16).padStart(8,"0") + (h1 >>> 0).toString(16).padStart(8,"0");
}

/* ---------------- Jobber status mapping ----------------
   Imported records (data.json) may carry Jobber's status strings.
   Internal statuses: Quote Draft|Sent|Approved|Converted|Declined,
   Invoice Draft|Sent|Paid (Past due is a display state), Job Active|Completed (+Late). */
function normStatusStr(s){ return String(s == null ? "" : s).trim().toLowerCase().replace(/\s+/g, " "); }
function mapQuoteStatus(s){
  const k = normStatusStr(s);
  const map = {
    "draft": "Draft",
    "sent": "Sent",
    "awaiting": "Sent",
    "awaiting approval": "Sent",
    "awaiting response": "Sent",
    "awaiting client": "Sent",
    "approved": "Approved",
    "accepted": "Approved",
    "converted": "Converted",
    "declined": "Declined",
    "rejected": "Declined"
  };
  if(map[k]) return map[k];
  if(!k) return null;
  return k.replace(/\b\w/g, c => c.toUpperCase()); /* unknown: keep, title-cased */
}
function mapInvoiceStatus(s){
  const k = normStatusStr(s);
  const map = {
    "draft": "Draft",
    "awaiting payment": "Sent",
    "awaiting": "Sent",
    "sent": "Sent",
    "unpaid": "Sent",
    "partially paid": "Sent",
    "partial": "Sent",
    "paid": "Paid",
    "paid in full": "Paid",
    "past due": "Past due",
    "pastdue": "Past due",
    "overdue": "Past due"
  };
  if(map[k]) return map[k];
  if(!k) return null;
  return k.replace(/\b\w/g, c => c.toUpperCase());
}
function mapJobStatus(s){
  const k = normStatusStr(s);
  if(["active", "in progress", "in-progress", "open", "scheduled", "late"].includes(k)) return k === "late" ? "Late" : "Active";
  if(["completed", "complete", "done", "closed", "finished"].includes(k)) return "Completed";
  if(!k) return null;
  return k.replace(/\b\w/g, c => c.toUpperCase());
}

/* ---------------- data.json (Jobber export) merge ----------------
   Merge keys: clients by id, then by name; quotes & invoices by their
   Jobber number (the natural key); jobs by id, then by quote number.
   The merge runs once per data.json content (stamp of the file text),
   so local edits made after an import are not overwritten on reload. */
function normNumber(num, prefix){
  let n = String(num == null ? "" : num).trim().replace(/^#/, "").trim();
  if(!n) return "";
  if(prefix && n.toUpperCase().indexOf(prefix) !== 0){
    const digits = n.replace(/[^0-9]/g, "");
    if(digits) n = prefix + digits;
  }
  return n;
}
function numKey(num){ return String(num == null ? "" : num).replace(/[^0-9]/g, ""); }
function findClientByName(name){
  const k = String(name || "").trim().toLowerCase();
  if(!k) return null;
  return DB.clients.find(c => c.name.trim().toLowerCase() === k) || null;
}
function findQuoteByNumber(num){
  const k = numKey(num);
  if(!k) return null;
  return DB.quotes.find(q => numKey(q.number) === k) || null;
}
function findInvoiceByNumber(num){
  const k = numKey(num);
  if(!k) return null;
  return DB.invoices.find(i => numKey(i.number) === k) || null;
}
function cleanTrade(t, hintText){
  const k = normStatusStr(t);
  if(k === "electric" || k === "electrical") return "Electric";
  if(k === "hvac" || k === "mechanical") return "HVAC";
  const hint = (String(t || "") + " " + String(hintText || "")).toLowerCase();
  if(/hvac|a\/c|air condition|heat pump|furnace|mini.?split/.test(hint)) return "HVAC";
  return "Electric";
}
function cleanClientType(t){
  const k = normStatusStr(t);
  if(k === "builder" || k === "homeowner" || k === "commercial") return k;
  if(k === "residential") return "homeowner";
  if(k === "gc" || k === "general contractor") return "builder";
  return "homeowner";
}
function mergeClientRecord(rec){
  let c = null;
  if(rec.id) c = DB.clients.find(x => x.id === rec.id) || null;
  if(!c && rec.name) c = findClientByName(rec.name);
  if(!c){
    c = { id: rec.id || ("c" + String(DB.seq.client++).padStart(3, "0")),
      type: cleanClientType(rec.type), name: String(rec.name || "Unnamed client"),
      phone: "", email: "", billingNotes: "", notes: "", contacts: [], properties: [],
      source: "Jobber import" };
    DB.clients.push(c);
  }
  if(rec.name) c.name = String(rec.name);
  if(rec.type) c.type = cleanClientType(rec.type);
  ["phone", "email", "billingNotes", "notes"].forEach(f => {
    if(rec[f] && !c[f]) c[f] = String(rec[f]);
  });
  (rec.contacts || []).forEach(rc => {
    const nm = String(rc.name || "").trim();
    if(!nm) return;
    if(!c.contacts.some(x => x.name.trim().toLowerCase() === nm.toLowerCase())){
      c.contacts.push({ id: rc.id || uid("ct"), name: nm, role: String(rc.role || ""),
        phone: String(rc.phone || ""), email: String(rc.email || "") });
    }
  });
  const props = (rec.properties || []).slice();
  if(rec.address && props.length === 0) props.push({ address: rec.address });
  props.forEach(rp => {
    const addr = String(rp.address || "").trim();
    const comm = String(rp.community || "").trim();
    if(!addr && !comm) return;
    const dup = c.properties.some(x =>
      (addr && String(x.address || "").trim().toLowerCase() === addr.toLowerCase()) ||
      (comm && String(x.community || "").trim().toLowerCase() === comm.toLowerCase() && !addr));
    if(!dup){
      c.properties.push({ id: rp.id || uid("p"), address: addr, community: comm,
        plan: String(rp.plan || ""), livingSF: rp.livingSF != null ? String(rp.livingSF) : "",
        roofSF: rp.roofSF != null ? String(rp.roofSF) : "" });
    }
  });
  return c;
}
function mergeQuoteRecord(rec){
  const number = normNumber(rec.number != null ? rec.number : (rec.quoteNumber != null ? rec.quoteNumber : rec.id), "Q-");
  if(!number) return null;
  let client = null;
  if(rec.clientId) client = DB.clients.find(x => x.id === rec.clientId) || null;
  if(!client && (rec.clientName || rec.client)) client = findClientByName(rec.clientName || rec.client);
  if(!client && (rec.clientName || rec.client)) client = mergeClientRecord({ name: rec.clientName || rec.client, type: rec.clientType });
  if(!client) return null;
  let propertyId = "";
  if(rec.propertyId && (client.properties || []).some(p => p.id === rec.propertyId)) propertyId = rec.propertyId;
  else if(rec.property || rec.propertyAddress){
    const want = String(rec.propertyAddress || rec.property || "").trim().toLowerCase();
    const p = (client.properties || []).find(x => String(x.address || "").trim().toLowerCase() === want || String(x.community || "").trim().toLowerCase() === want);
    if(p) propertyId = p.id;
  }
  const lines = (rec.lines || rec.lineItems || []).map(l => ({
    desc: String(l.desc || l.description || l.name || ""),
    qty: Number(l.qty != null ? l.qty : (l.quantity != null ? l.quantity : 1)) || 0,
    price: Number(l.price != null ? l.price : (l.unitPrice != null ? l.unitPrice : (l.amount != null ? l.amount : 0))) || 0
  })).filter(l => l.desc || l.price);
  const mapped = mapQuoteStatus(rec.status) || "Draft";
  const fields = {
    clientId: client.id,
    propertyId: propertyId,
    trade: cleanTrade(rec.trade, rec.title || rec.name || (lines[0] && lines[0].desc)),
    title: String(rec.title || rec.name || ""),
    lines: lines,
    totalAmount: (rec.total != null ? Number(rec.total) : (rec.amount != null ? Number(rec.amount) : null)),
    status: mapped === "Past due" ? "Sent" : mapped,
    createdAt: String(rec.createdAt || rec.date || rec.issuedDate || todayStr()).slice(0, 10),
    sentAt: rec.sentAt ? String(rec.sentAt).slice(0, 10) : null,
    approvedAt: rec.approvedAt ? String(rec.approvedAt).slice(0, 10) : null
  };
  let q = findQuoteByNumber(number);
  if(q){ Object.assign(q, fields); }
  else {
    q = Object.assign({ id: uid("q"), number: number }, fields);
    DB.quotes.push(q);
  }
  const digits = parseInt(numKey(number), 10);
  if(digits && digits >= DB.seq.quote) DB.seq.quote = digits + 1;
  return q;
}
function mergeInvoiceRecord(rec){
  const number = normNumber(rec.number != null ? rec.number : (rec.invoiceNumber != null ? rec.invoiceNumber : rec.id), "INV-");
  if(!number) return null;
  let client = null;
  if(rec.clientId) client = DB.clients.find(x => x.id === rec.clientId) || null;
  if(!client && (rec.clientName || rec.client)) client = findClientByName(rec.clientName || rec.client);
  if(!client && (rec.clientName || rec.client)) client = mergeClientRecord({ name: rec.clientName || rec.client, type: rec.clientType });
  if(!client) return null;
  let quoteId = "", jobId = rec.jobId || "";
  const qref = rec.quoteNumber != null ? rec.quoteNumber : rec.quoteId;
  if(qref){
    const q = DB.quotes.find(x => x.id === qref) || findQuoteByNumber(qref);
    if(q){ quoteId = q.id; const j = DB.jobs.find(x => x.quoteId === q.id); if(j && !jobId) jobId = j.id; }
  }
  const mapped = mapInvoiceStatus(rec.status) || "Draft";
  const payments = [];
  const rawPays = rec.payments || (rec.payment ? [rec.payment] : []);
  rawPays.forEach(p => {
    payments.push({ date: String(p.date || rec.createdAt || todayStr()).slice(0, 10),
      method: String(p.method || ""), ref: String(p.ref || p.reference || ""),
      amount: Number(p.amount != null ? p.amount : (rec.amount != null ? rec.amount : (rec.total != null ? rec.total : 0))) || 0 });
  });
  const fields = {
    clientId: client.id,
    jobId: jobId,
    quoteId: quoteId,
    propertyId: rec.propertyId || "",
    trade: cleanTrade(rec.trade, rec.title || ""),
    basis: rec.basis === "draw" ? "draw" : "full",
    drawPct: rec.drawPct != null ? Number(rec.drawPct) : null,
    amount: Number(rec.amount != null ? rec.amount : (rec.total != null ? rec.total : 0)) || 0,
    status: mapped === "Past due" ? "Sent" : mapped,
    pastDue: mapped === "Past due" ? true : !!rec.pastDue,
    dueDate: rec.dueDate ? String(rec.dueDate).slice(0, 10) : null,
    createdAt: String(rec.createdAt || rec.issuedDate || rec.date || todayStr()).slice(0, 10),
    sentAt: rec.sentAt ? String(rec.sentAt).slice(0, 10) : null,
    payments: payments
  };
  if(fields.status === "Sent" && !fields.sentAt) fields.sentAt = fields.createdAt;
  let inv = findInvoiceByNumber(number);
  if(inv){ Object.assign(inv, fields); }
  else {
    inv = Object.assign({ id: uid("inv"), number: number }, fields);
    DB.invoices.push(inv);
  }
  const digits = parseInt(numKey(number), 10);
  if(digits && digits >= DB.seq.invoice) DB.seq.invoice = digits + 1;
  return inv;
}
function mergeJobRecord(rec){
  let job = null;
  if(rec.id) job = DB.jobs.find(x => x.id === rec.id) || null;
  let quote = null;
  const qref = rec.quoteNumber != null ? rec.quoteNumber : rec.quoteId;
  if(qref) quote = DB.quotes.find(x => x.id === qref) || findQuoteByNumber(qref);
  if(!job && quote) job = DB.jobs.find(x => x.quoteId === quote.id) || null;
  let client = null;
  if(rec.clientId) client = DB.clients.find(x => x.id === rec.clientId) || null;
  if(!client && quote) client = DB.clients.find(x => x.id === quote.clientId) || null;
  if(!client && (rec.clientName || rec.client)) client = findClientByName(rec.clientName || rec.client);
  if(!client && (rec.clientName || rec.client)) client = mergeClientRecord({ name: rec.clientName || rec.client, type: rec.clientType });
  if(!client) return null;
  const mapped = mapJobStatus(rec.status);
  if(!job){
    job = { id: rec.id || uid("j"), quoteId: quote ? quote.id : "", clientId: client.id,
      propertyId: rec.propertyId || (quote ? quote.propertyId : ""), trade: cleanTrade(rec.trade, rec.title || ""),
      createdAt: String(rec.createdAt || rec.date || todayStr()).slice(0, 10), stages: blankStages(),
      status: "Active", lateFlag: false };
    DB.jobs.push(job);
  }
  if(quote && !job.quoteId) job.quoteId = quote.id;
  job.clientId = client.id;
  if(rec.title) job.title = String(rec.title);
  if(rec.number != null) job.jobberNumber = String(rec.number).replace(/^#/, "");
  const jAmt = rec.total != null ? Number(rec.total) : (rec.amount != null ? Number(rec.amount) : null);
  if(jAmt != null && !isNaN(jAmt)) job.amount = jAmt;
  if(mapped === "Completed") job.status = "Completed";
  else if(mapped === "Late"){ job.status = "Active"; job.lateFlag = true; }
  else if(mapped === "Active" && job.status !== "Completed") job.status = "Active";
  if(rec.stages){
    if(Array.isArray(rec.stages)){
      rec.stages.forEach(s => {
        const key = STAGES.find(st => st.label.toLowerCase() === normStatusStr(s.name || s.label || s.key) || st.key === normStatusStr(s.key || s.name));
        if(key){
          const st = normStatusStr(s.status);
          job.stages[key.key] = { status: st === "done" || st === "completed" || st === "complete" ? "done" : (st === "scheduled" || st === "sched" ? "sched" : "not"),
            date: s.date ? String(s.date).slice(0, 10) : (job.stages[key.key] ? job.stages[key.key].date : "") };
        }
      });
    } else {
      STAGES.forEach(st => {
        const s = rec.stages[st.key];
        if(!s) return;
        const raw = typeof s === "string" ? { status: s } : s;
        const v = normStatusStr(raw.status);
        job.stages[st.key] = { status: v === "done" || v === "completed" || v === "complete" ? "done" : (v === "scheduled" || v === "sched" ? "sched" : "not"),
          date: raw.date ? String(raw.date).slice(0, 10) : (job.stages[st.key] ? job.stages[st.key].date : "") };
      });
    }
  }
  if(job.stages.final && job.stages.final.status === "done") job.status = "Completed";
  return job;
}
function mergeExternalData(data){
  const counts = { clients: 0, quotes: 0, jobs: 0, invoices: 0 };
  if(!data || typeof data !== "object") return counts;
  (data.clients || []).forEach(r => { if(mergeClientRecord(r)) counts.clients++; });
  (data.quotes || []).forEach(r => { if(mergeQuoteRecord(r)) counts.quotes++; });
  (data.jobs || []).forEach(r => { if(mergeJobRecord(r)) counts.jobs++; });
  (data.invoices || []).forEach(r => { if(mergeInvoiceRecord(r)) counts.invoices++; });
  return counts;
}
async function loadExternalData(){
  try {
    const res = await fetch("data.json", { cache: "no-store" });
    if(!res || !res.ok) return;
    const text = await res.text();
    const stamp = djb2(text);
    if(DB.importStamp === stamp) return;
    const data = JSON.parse(text);
    const counts = mergeExternalData(data);
    DB.importStamp = stamp;
    DB.importInfo = { at: todayStr(), counts: counts };
    saveDB();
    if(UNLOCKED) render();
  } catch(e){ /* no data.json in this folder yet — the app runs on local data */ }
}

/* ---------------- app state & lookups ---------------- */
let TAB = "home";
let selClientId = null, selQuoteId = null, selJobId = null, selInvoiceId = null, selRequestId = null;
let clientSearch = "", clientFilter = "all";
let quoteFilter = "All", quoteSort = "new";
let productSearch = "";

function clientById(id){ return DB.clients.find(c => c.id === id) || null; }
function quoteById(id){ return DB.quotes.find(q => q.id === id) || null; }
function jobById(id){ return DB.jobs.find(j => j.id === id) || null; }
function invoiceById(id){ return DB.invoices.find(i => i.id === id) || null; }
function requestById(id){ return DB.requests.find(r => r.id === id) || null; }
function propertyById(client, pid){
  if(!client || !pid) return null;
  return (client.properties || []).find(p => p.id === pid) || null;
}
function propertyLabel(client, pid){
  const p = propertyById(client, pid);
  if(!p) return "No property selected";
  if(client && String(client.type).toLowerCase() === "builder"){
    return (p.community || "—") + (p.address ? " · " + p.address : "");
  }
  return p.address || "—";
}
function clientAddressLine(c){
  if(!c) return "";
  const p = (c.properties || [])[0];
  if(p) return String(c.type).toLowerCase() === "builder"
    ? ((p.community || "") + (p.address ? " · " + p.address : "")).trim()
    : (p.address || "");
  return "";
}
function quoteTotal(q){
  const lines = q.lines || [];
  if(lines.length) return lines.reduce((sum, l) => sum + (Number(l.qty) || 0) * (Number(l.price) || 0), 0);
  return Number(q.totalAmount) || 0;
}
function quoteTitle(q){
  if(q.title) return q.title;
  if(q.lines && q.lines.length && q.lines[0].desc) return q.lines[0].desc;
  const c = clientById(q.clientId);
  return propertyLabel(c, q.propertyId) !== "No property selected" ? propertyLabel(c, q.propertyId) : (q.trade + " quote");
}
const STAGES = [
  { key: "tug",         label: "TUG" },
  { key: "underground", label: "Underground" },
  { key: "roughin",     label: "Rough-in" },
  { key: "trim",        label: "Trim" },
  { key: "final",       label: "Final" }
];
function blankStages(){
  const s = {};
  STAGES.forEach(st => { s[st.key] = { status: "not", date: "" }; });
  return s;
}
function jobDoneCount(job){
  return STAGES.filter(st => job.stages && job.stages[st.key] && job.stages[st.key].status === "done").length;
}
function jobIsLate(job){
  if(job.lateFlag) return true;
  const t = todayStr();
  return STAGES.some(st => {
    const s = job.stages && job.stages[st.key];
    return s && s.status === "sched" && s.date && s.date < t;
  });
}
function jobDisplayStatus(job){
  if((job.stages && job.stages.final && job.stages.final.status === "done") || job.status === "Completed") return "Completed";
  if(jobIsLate(job)) return "Late";
  return "Active";
}
function jobAmount(job){
  const q = job.quoteId ? quoteById(job.quoteId) : null;
  return q ? quoteTotal(q) : (Number(job.amount) || 0);
}
function jobInvoiced(job){
  return DB.invoices.filter(i => i.jobId === job.id && i.status !== "Draft")
    .reduce((s, i) => s + (Number(i.amount) || 0), 0);
}
function invoicePaidSum(inv){
  return (inv.payments || []).reduce((s, p) => s + (Number(p.amount) || 0), 0);
}
function invoiceBalance(inv){
  return Math.max(0, Math.round(((Number(inv.amount) || 0) - invoicePaidSum(inv)) * 100) / 100);
}
function invoiceIsPastDue(inv){
  if(inv.status !== "Sent") return false;
  if(invoiceBalance(inv) <= 0) return false;
  if(inv.pastDue) return true;
  const t = todayStr();
  if(inv.dueDate && inv.dueDate < t) return true;
  const from = inv.sentAt || inv.createdAt;
  return from ? daysBetween(from, t) > 30 : false;
}
function displayInvoiceStatus(inv){
  if(inv.status === "Paid" || (inv.status === "Sent" && invoiceBalance(inv) <= 0 && invoicePaidSum(inv) > 0)) return "Paid";
  if(inv.status === "Draft") return "Draft";
  if(invoiceIsPastDue(inv)) return "Past due";
  return "Awaiting payment";
}
function clientBalanceOwed(clientId){
  return DB.invoices.filter(i => i.clientId === clientId && i.status === "Sent")
    .reduce((s, i) => s + invoiceBalance(i), 0);
}
function clientMoney(clientId){
  const quoted = DB.quotes.filter(q => q.clientId === clientId && q.status !== "Declined")
    .reduce((s, q) => s + quoteTotal(q), 0);
  const invoiced = DB.invoices.filter(i => i.clientId === clientId && i.status !== "Draft")
    .reduce((s, i) => s + (Number(i.amount) || 0), 0);
  const paid = DB.invoices.filter(i => i.clientId === clientId)
    .reduce((s, i) => s + invoicePaidSum(i), 0);
  return { quoted: quoted, invoiced: invoiced, paid: paid, owed: clientBalanceOwed(clientId) };
}
/* dashboard helpers (Jobber Home insights) */
function quotesAwaitingApproval(){
  const list = DB.quotes.filter(q => q.status === "Sent");
  return { count: list.length, total: list.reduce((s, q) => s + quoteTotal(q), 0), list: list };
}
function invoicesAwaitingPayment(){
  const list = DB.invoices.filter(i => displayInvoiceStatus(i) === "Awaiting payment");
  return { count: list.length, total: list.reduce((s, i) => s + invoiceBalance(i), 0), list: list };
}
function invoicesPastDue(){
  const list = DB.invoices.filter(i => displayInvoiceStatus(i) === "Past due");
  return { count: list.length, total: list.reduce((s, i) => s + invoiceBalance(i), 0), list: list };
}
function activeJobs(){
  return DB.jobs.filter(j => jobDisplayStatus(j) !== "Completed");
}
function jobsScheduledToday(){
  const t = todayStr();
  return DB.jobs.filter(j => STAGES.some(st => {
    const s = j.stages && j.stages[st.key];
    return s && s.status === "sched" && s.date === t;
  }));
}
function recentActivity(limit){
  const items = [];
  DB.quotes.forEach(q => items.push({ kind: "quote", id: q.id, date: q.createdAt || "",
    title: q.number + " — " + quoteTitle(q), sub: "Quote · " + q.status + " · " + money(quoteTotal(q)) }));
  DB.jobs.forEach(j => {
    const c = clientById(j.clientId);
    items.push({ kind: "job", id: j.id, date: j.createdAt || "",
      title: (c ? c.name : "Job") + " — " + j.trade + " job",
      sub: "Job · " + jobDisplayStatus(j) + " · " + jobDoneCount(j) + " of 5 stages done" });
  });
  DB.invoices.forEach(i => items.push({ kind: "invoice", id: i.id, date: i.createdAt || "",
    title: i.number + " — " + (clientById(i.clientId) ? clientById(i.clientId).name : "Invoice"),
    sub: "Invoice · " + displayInvoiceStatus(i) + " · " + money(i.amount) }));
  items.sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.title.localeCompare(a.title));
  return items.slice(0, limit || 8);
}

/* ---------------- app entry / tab routing ---------------- */
function enterApp(){
  gateEl().classList.add("hidden");
  gateEl().innerHTML = "";
  $("#appshell").classList.remove("hidden");
  $("#rolebadge").textContent = ROLE;
  render();
  window.scrollTo(0, 0);

function tabHighlight(){
  if(TAB === "home") return "home";
  if(TAB === "clients") return "clients";
  if(TAB === "quotes") return "quotes";
  if(TAB === "jobs") return "jobs";
  if(TAB === "invoices") return "invoices";
  return "more"; /* more, requests, products, settings */
}
function go(tab){
  TAB = tab;
  if(tab !== "clients") selClientId = null;
  if(tab !== "quotes") selQuoteId = null;
  if(tab !== "jobs") selJobId = null;
  if(tab !== "invoices") selInvoiceId = null;
  if(tab !== "requests") selRequestId = null;
  render();
  window.scrollTo(0, 0);
}
function render(){
  document.querySelectorAll("#tabbar button").forEach(b => {
    b.classList.toggle("on", b.dataset.tab === tabHighlight());
  });
  const m = $("#main");
  if(TAB === "home") m.innerHTML = viewHome();
  else if(TAB === "clients") m.innerHTML = selClientId ? viewClientDetail(clientById(selClientId)) : viewClients();
  else if(TAB === "quotes") m.innerHTML = selQuoteId ? viewQuoteDetail(quoteById(selQuoteId)) : viewQuotes();
  else if(TAB === "jobs") m.innerHTML = selJobId ? viewJobDetail(jobById(selJobId)) : viewJobs();
  else if(TAB === "invoices") m.innerHTML = selInvoiceId ? viewInvoiceDetail(invoiceById(selInvoiceId)) : viewInvoices();
  else if(TAB === "more") m.innerHTML = viewMore();
  else if(TAB === "requests") m.innerHTML = selRequestId ? viewRequestDetail(requestById(selRequestId)) : viewRequests();
  else if(TAB === "products") m.innerHTML = viewProducts();
  else if(TAB === "settings") m.innerHTML = viewSettings();
  bindView();
}
function bindView(){
  if(TAB === "home") bindHome();
  else if(TAB === "clients") { selClientId ? bindClientDetail() : bindClients(); }
  else if(TAB === "quotes") { selQuoteId ? bindQuoteDetail() : bindQuotes(); }
  else if(TAB === "jobs") { selJobId ? bindJobDetail() : bindJobs(); }
  else if(TAB === "invoices") { selInvoiceId ? bindInvoiceDetail() : bindInvoices(); }
  else if(TAB === "more") bindMore();
  else if(TAB === "requests") { selRequestId ? bindRequestDetail() : bindRequests(); }
  else if(TAB === "products") bindProducts();
  else if(TAB === "settings") bindSettings();
}

/* ---------------- HOME (Jobber dashboard) ---------------- */
function etHour(){
  try {
    const s = new Date().toLocaleString("en-US", { timeZone: "America/New_York", hour: "numeric", hour12: false });
    const h = parseInt(s, 10);
    return isNaN(h) ? new Date().getHours() : h % 24;
  } catch(e){ return new Date().getHours(); }
}
function greeting(){
  const h = etHour();
  if(h < 12) return "Good morning";
  if(h < 18) return "Good afternoon";
  return "Good evening";
}
function followUps(){
  const t = todayStr(), out = [];
  DB.quotes.forEach(q => {
    if(q.status === "Draft"){
      const age = daysBetween(q.createdAt, t);
      if(age > 7){
        const c = clientById(q.clientId);
        out.push({ kind: "quote", id: q.id, red: false,
          text: "Quote " + q.number + " — " + (c ? c.name : "Unknown client") + " (" + q.trade + ")",
          sub: "Still a draft after " + age + " days · " + money(quoteTotal(q)) });
      }
    }
    if(q.status === "Sent"){
      const age = daysBetween(q.sentAt || q.createdAt, t);
      if(age > 7){
        const c = clientById(q.clientId);
        out.push({ kind: "quote", id: q.id, red: false,
          text: "Quote " + q.number + " — " + (c ? c.name : "Unknown client") + " (" + q.trade + ")",
          sub: "Sent " + age + " days ago, no approval yet · " + money(quoteTotal(q)) });
      }
    }
  });
  DB.invoices.forEach(inv => {
    if(displayInvoiceStatus(inv) === "Past due"){
      const c = clientById(inv.clientId);
      out.push({ kind: "invoice", id: inv.id, red: true,
        text: "Invoice " + inv.number + " — " + (c ? c.name : "Unknown client"),
        sub: "Past due · " + money(invoiceBalance(inv)) + " still owed" });
    }
  });
  return out;
}
function viewHome(){
  const qa = quotesAwaitingApproval();
  const ap = invoicesAwaitingPayment();
  const pd = invoicesPastDue();
  const aj = activeJobs();
  const st = jobsScheduledToday();
  const ups = followUps();

  let h = '<div class="greet">' + greeting() + (ROLE === "Owner" ? ", Sanjay" : "") + '</div>';
  h += '<div class="greet-sub">' + fmtDate(todayStr()) + ' · Here is where the business stands.</div>';
  h += '<div class="stats">';

  h += '<button class="stat" data-nav="invoices"><div class="n">' + ap.count + '</div><div class="l">Awaiting payment</div><div class="s">' + money(ap.total) + '</div></button>';
  h += '<button class="stat' + (pd.count ? " alert" : "") + '" data-nav="invoices"><div class="n">' + pd.count + '</div><div class="l">Past due</div><div class="s">' + money(pd.total) + '</div></button>';
  h += '<button class="stat" data-nav="jobs"><div class="n">' + aj.length + '</div><div class="l">Active jobs</div></button>';
  h += '<button class="stat" data-nav="jobs"><div class="n">' + st.length + '</div><div class="l">Scheduled today</div></button>';
  h += '<button class="stat" data-nav="clients"><div class="n">' + DB.clients.length + '</div><div class="l">Clients</div></button>';
  h += '</div>';
  h += '<h3 class="sec">Recent activity</h3>';
  if(acts.length === 0){
    h += '<div class="empty">No quotes, jobs or invoices yet. New activity will show up here.</div>';
  } else {
    acts.forEach(a => {
      h += '<button class="rowitem" data-act="' + a.kind + ':' + a.id + '"><span class="grow">' +
             '<span class="name">' + esc(a.title) + '</span><div class="meta">' + esc(a.sub) + (a.date ? ' · ' + fmtDate(a.date) : '') + '</div></span>' +
             '<span class="chev">›</span></button>';

  h += '<h3 class="sec">Follow-ups due (' + ups.length + ')</h3>';
  if(ups.length === 0){
    h += '<div class="empty">No follow-ups due. Old drafts, unanswered sent quotes and past-due invoices will show up here.</div>';
  } else {
    ups.forEach(u => {
      h += '<button class="rowitem followup' + (u.red ? " red" : "") + '" data-follow="' + u.kind + ':' + u.id + '">' +
             '<span class="grow"><span class="name">' + esc(u.text) + '</span><div class="meta">' + esc(u.sub) + '</div></span>' +
             '<span class="chev">›</span></button>';
    });

function bindClientDetail(){
  const c = clientById(selClientId);
  $("#backclients").addEventListener("click", () => { selClientId = null; render(); });
  if(!c) return;
  $("#editclient").addEventListener("click", () => { clientFormOpen = true; editingClientId = c.id; render(); });
  if(clientFormOpen && editingClientId === c.id) bindClientForm();
  $("#ctadd").addEventListener("click", () => {
    const name = $("#ct-name").value.trim();
    if(!name){ alert("The contact needs a name."); return; }
    c.contacts.push({ id: uid("ct"), name: name, role: $("#ct-role").value.trim(), phone: $("#ct-phone").value.trim(), email: $("#ct-email").value.trim() });
    saveDB(); render();
  });
  $("#pfadd").addEventListener("click", () => {
    const isBuilder = String(c.type).toLowerCase() === "builder";
    const p = { id: uid("p"), address: $("#pf-address").value.trim() };
    if(isBuilder){
      p.community = $("#pf-community").value.trim();
      p.plan = $("#pf-plan").value.trim();
      p.livingSF = $("#pf-living").value.trim();
      p.roofSF = $("#pf-roof").value.trim();
      if(!p.community && !p.address){ alert("Add at least a community or a lot/address."); return; }
    } else if(!p.address){ alert("Add the property address."); return; }
    c.properties.push(p);
    saveDB(); render();
  });
  document.querySelectorAll("[data-goquote]").forEach(b => b.addEventListener("click", () => { selQuoteId = b.dataset.goquote; TAB = "quotes"; render(); window.scrollTo(0,0); }));
  document.querySelectorAll("[data-gojob]").forEach(b => b.addEventListener("click", () => { selJobId = b.dataset.gojob; TAB = "jobs"; render(); window.scrollTo(0,0); }));
  document.querySelectorAll("[data-goinvoice]").forEach(b => b.addEventListener("click", () => { selInvoiceId = b.dataset.goinvoice; TAB = "invoices"; render(); window.scrollTo(0,0); }));
}

/* ---------------- QUOTES ----------------
   Jobber order: Draft → Sent → Approved → Converted (Declined off Sent).
   Price-carrying actions are OWNER-ONLY: creating a quote, editing its
   lines/amounts, and Mark Sent. Office can record the client's approval
   or decline, and convert an approved quote to a job. */
let quoteFormOpen = false, editingQuoteId = null;
const QUOTE_FLOW = ["Draft", "Sent", "Approved", "Converted", "Declined"];
function quotePill(st){
  if(st === "Draft") return '<span class="pill grey">Draft</span>';
  if(st === "Sent") return '<span class="pill blue">Sent</span>';
  if(st === "Approved") return '<span class="pill green">Approved</span>';
  if(st === "Converted") return '<span class="pill navy">Converted</span>';
  if(st === "Declined") return '<span class="pill red">Declined</span>';
  return '<span class="pill grey">' + esc(st) + '</span>';
}
function tradeTag(trade){
  return trade === "HVAC" ? '<span class="badge gold">HVAC</span>' : '<span class="badge">Electric</span>';
}
function viewQuotes(){
  let h = '<h2 class="view">Quotes</h2>';
  if(ROLE === "Owner") h += '<button class="btn gold block" id="addquote">＋ New quote</button>';
  else h += '<div class="empty" style="text-align:left">Quote prices are set by the Owner. Office can record approvals below, but cannot create quotes, change amounts, or send them.</div>';
  if(quoteFormOpen) h += quoteFormHTML(editingQuoteId ? quoteById(editingQuoteId) : null);
  h += '<div class="chips" id="qchips">' +
    ["All"].concat(QUOTE_FLOW).map(v =>
      '<button data-qf="' + v + '"' + (quoteFilter === v ? ' class="on"' : '') + '>' + v + '</button>').join("") + '</div>';
  h += '<label class="f">Sort</label><select id="qsort">' +
    '<option value="new"' + (quoteSort === "new" ? " selected" : "") + '>Newest first</option>' +
    '<option value="old"' + (quoteSort === "old" ? " selected" : "") + '>Oldest first</option>' +
    '<option value="amt"' + (quoteSort === "amt" ? " selected" : "") + '>Amount — high to low</option>' +
    '<option value="status"' + (quoteSort === "status" ? " selected" : "") + '>By status (Draft → Sent → Approved…)</option></select>';
  h += '<div style="height:8px"></div>';
  let list = DB.quotes.filter(q => quoteFilter === "All" || q.status === quoteFilter);
  list = list.slice();
  if(quoteSort === "new") list.reverse();
  else if(quoteSort === "amt") list.sort((a, b) => quoteTotal(b) - quoteTotal(a));
  else if(quoteSort === "status") list.sort((a, b) => QUOTE_FLOW.indexOf(a.status) - QUOTE_FLOW.indexOf(b.status));
  if(DB.quotes.length === 0 && !quoteFormOpen){
    h += '<div class="empty">No quotes yet. In Jobber order: a quote is drafted, sent, approved by the client, then converted to a job.</div>';
  } else if(list.length === 0){
    h += '<div class="empty">No quotes with status “' + esc(quoteFilter) + '”.</div>';
  }
  list.forEach(q => {
    const c = clientById(q.clientId);
    h += '<button class="rowitem" data-quote="' + q.id + '"><span class="grow">' +
           '<span class="name">' + q.number + ' · ' + esc(quoteTitle(q)) + '</span>' +
           '<div class="meta">' + esc(c ? c.name : "Unknown client") + ' · ' + fmtDate(q.createdAt) + '</div></span>' +
           tradeTag(q.trade) + '<span class="amt">' + money(quoteTotal(q)) + '</span>' + quotePill(q.status) + '<span class="chev">›</span></button>';
  });
  return h;
}
function lineRowHTML(l){
  l = l || { desc: "", qty: 1, price: "" };
  return '<div class="linerow"><input type="text" class="li-desc" placeholder="Description" value="' + esc(l.desc) + '">' +
    '<input type="number" class="li-qty" min="0" step="any" value="' + esc(l.qty) + '" aria-label="Quantity">' +
    '<input type="number" class="li-price" min="0" step="any" placeholder="$ Unit price" value="' + esc(l.price) + '" aria-label="Unit price">' +
    '<button type="button" class="del" title="Remove line">✕</button></div>';
}
function productPickerHTML(){
  const cats = {};
  PRODUCTS.forEach((p, i) => { (cats[p.category] = cats[p.category] || []).push(i); });
  let h = '<label class="f">Add a line from the product library</label>' +
    '<div style="display:flex;gap:8px"><select id="qf-product" style="flex:1"><option value="">Pick a product…</option>';
  Object.keys(cats).sort().forEach(cat => {
    h += '<optgroup label="' + esc(categoryLabel(cat)) + '">';
    cats[cat].forEach(i => {
      const p = PRODUCTS[i];
      h += '<option value="' + i + '">' + esc(p.name + (p.model ? " — " + p.model : "")) + '</option>';
    });
    h += '</optgroup>';
  });
  h += '</select><button type="button" class="btn ghost" id="qf-addprod" style="min-height:52px">Add</button></div>' +
    '<p class="muted small">The picker fills the description and model only — the price stays blank for the Owner to price. Prices are never pulled in automatically.</p>';
  return h;
}
function quoteFormHTML(q){
  const isNew = !q;
  q = q || { clientId: "", propertyId: "", trade: "", title: "", lines: [{ desc: "", qty: 1, price: "" }] };
  let h = '<div class="card" id="quoteform"><h3 class="sec" style="margin-top:0">' + (isNew ? "New quote" : "Edit quote " + q.number) + '</h3>';
  h += '<label class="f">Client *</label><select id="qf-client"><option value="">Select a client…</option>';
  DB.clients.forEach(c => { h += '<option value="' + c.id + '"' + (q.clientId === c.id ? " selected" : "") + '>' + esc(c.name) + '</option>'; });
  h += '</select>';
  h += '<label class="f">Property</label><select id="qf-property"></select>';
  h += '<label class="f">Title</label><input type="text" id="qf-title" placeholder="e.g. Rough-in — Lot 12, Eunice" value="' + esc(q.title || "") + '">';
  h += '<label class="f">Trade * — one trade per quote</label><select id="qf-trade">' +
       '<option value="">Select trade…</option>' +
       '<option value="Electric"' + (q.trade === "Electric" ? " selected" : "") + '>Electric</option>' +
       '<option value="HVAC"' + (q.trade === "HVAC" ? " selected" : "") + '>HVAC</option></select>';
  h += productPickerHTML();
  h += '<label class="f">Line items</label><div id="qf-lines">';
  (q.lines && q.lines.length ? q.lines : [{ desc: "", qty: 1, price: "" }]).forEach(l => { h += lineRowHTML(l); });
  h += '</div><button type="button" class="btn ghost" id="qf-addline" style="min-height:48px">＋ Add line</button>';
  h += '<div class="totalrow"><span>Total</span><span id="qf-total">' + money(quoteTotal(q)) + '</span></div>';
  h += '<div class="err" id="qferr"></div>';
  h += '<button class="btn block" id="qfsave">' + (isNew ? "Save draft quote" : "Save changes") + '</button>';
  h += '<button class="btn ghost block" id="qfcancel">Cancel</button></div>';
  return h;
}
function fillPropertyOptions(clientId, selectedPid){
  const sel = $("#qf-property");
  if(!sel) return;
  const c = clientById(clientId);
  let h = '<option value="">No property selected</option>';
  if(c) (c.properties || []).forEach(p => {
    h += '<option value="' + p.id + '"' + (selectedPid === p.id ? " selected" : "") + '>' + esc(propertyLabel(c, p.id)) + '</option>';
  });
  sel.innerHTML = h;
}
function readLineRows(){
  const rows = [];
  document.querySelectorAll("#qf-lines .linerow").forEach(r => {
    rows.push({ desc: $(".li-desc", r).value.trim(), qty: Number($(".li-qty", r).value) || 0, price: Number($(".li-price", r).value) || 0 });
  });
  return rows;
}
function refreshQuoteTotal(){
  const t = readLineRows().reduce((s, l) => s + l.qty * l.price, 0);
  const el = $("#qf-total");
  if(el) el.textContent = money(t);
}
function bindQuoteForm(){
  const q = editingQuoteId ? quoteById(editingQuoteId) : null;
  fillPropertyOptions($("#qf-client").value, q ? q.propertyId : "");
  $("#qf-client").addEventListener("change", e => fillPropertyOptions(e.target.value, ""));
  $("#qf-addline").addEventListener("click", () => {
    $("#qf-lines").insertAdjacentHTML("beforeend", lineRowHTML(null));
    wireLineRows();
  });
  $("#qf-addprod").addEventListener("click", () => {
    const v = $("#qf-product").value;
    if(v === "") return;
    const p = PRODUCTS[Number(v)];
    const desc = p.name + (p.model ? " — " + p.model : "");
    $("#qf-lines").insertAdjacentHTML("beforeend", lineRowHTML({ desc: desc, qty: 1, price: "" }));
    wireLineRows();
    refreshQuoteTotal();
  });
  wireLineRows();
  $("#qfcancel").addEventListener("click", () => { quoteFormOpen = false; editingQuoteId = null; render(); });
  $("#qfsave").addEventListener("click", () => {
    const err = $("#qferr");
    const clientId = $("#qf-client").value;
    const trade = $("#qf-trade").value;
    const lines = readLineRows().filter(l => l.desc || l.price);
    if(!clientId){ err.textContent = "Pick the client first."; err.style.display = "block"; return; }
    if(!trade){ err.textContent = "Trade is required — Electric or HVAC. One trade per quote, always."; err.style.display = "block"; return; }
    if(lines.length === 0){ err.textContent = "Add at least one line item."; err.style.display = "block"; return; }
    if(editingQuoteId){
      Object.assign(quoteById(editingQuoteId), { clientId: clientId, propertyId: $("#qf-property").value, trade: trade, title: $("#qf-title").value.trim(), lines: lines, totalAmount: null });
    } else {
      const nq = { id: uid("q"), number: "Q-" + (DB.seq.quote++), clientId: clientId,
        propertyId: $("#qf-property").value, trade: trade, title: $("#qf-title").value.trim(), lines: lines,
        totalAmount: null, status: "Draft", createdAt: todayStr(), sentAt: null, approvedAt: null };
      DB.quotes.push(nq);
      selQuoteId = nq.id;
    }
    saveDB();
    quoteFormOpen = false; editingQuoteId = null;
    render();
  });
}
function wireLineRows(){
  document.querySelectorAll("#qf-lines .linerow").forEach(r => {
    $(".del", r).onclick = () => { r.remove(); refreshQuoteTotal(); };
    r.querySelectorAll("input").forEach(inp => inp.oninput = refreshQuoteTotal);
  });
}
function bindQuotes(){
  const add = $("#addquote");
  if(add) add.addEventListener("click", () => { quoteFormOpen = true; editingQuoteId = null; render(); });
  document.querySelectorAll("[data-qf]").forEach(b => b.addEventListener("click", () => { quoteFilter = b.dataset.qf; render(); }));
  const so = $("#qsort");
  if(so) so.addEventListener("change", () => { quoteSort = so.value; render(); });
  document.querySelectorAll("[data-quote]").forEach(b => b.addEventListener("click", () => {
    selQuoteId = b.dataset.quote; quoteFormOpen = false; render(); window.scrollTo(0, 0);
  }));
  if(quoteFormOpen) bindQuoteForm();
}
function viewQuoteDetail(q){
  if(!q) return '<div class="empty">That quote no longer exists.</div>';
  const c = clientById(q.clientId);
  let h = '<button class="backbtn" id="backquotes">← All quotes</button>';
  h += '<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap">' +
         '<div><div style="font-size:1.25rem;font-weight:800">' + q.number + '</div>' +
         '<div style="font-weight:700">' + esc(quoteTitle(q)) + '</div>' +
         '<div class="muted">' + esc(c ? c.name : "Unknown client") + ' · ' + esc(propertyLabel(c, q.propertyId)) + '</div></div>' +
         quotePill(q.status) + '</div>';
  h += '<div class="kv"><span class="k">Trade</span><span class="v">' + q.trade + '</span></div>';
  h += '<div class="kv"><span class="k">Created</span><span class="v">' + fmtDate(q.createdAt) + '</span></div>';
  if(q.sentAt) h += '<div class="kv"><span class="k">Sent</span><span class="v">' + fmtDate(q.sentAt) + '</span></div>';
  if(q.approvedAt) h += '<div class="kv"><span class="k">Client approved</span><span class="v">' + fmtDate(q.approvedAt) + '</span></div>';
  h += '<table class="lines"><tr><th>Description</th><th class="num">Qty</th><th class="num">Unit</th><th class="num">Line total</th></tr>';
  (q.lines || []).forEach(l => {
    h += '<tr><td>' + esc(l.desc) + '</td><td class="num">' + esc(l.qty) + '</td><td class="num">' + money(l.price) + '</td><td class="num">' + money((Number(l.qty) || 0) * (Number(l.price) || 0)) + '</td></tr>';
  });
  if(!(q.lines || []).length) h += '<tr><td colspan="4" class="muted">No line items yet' + (q.totalAmount ? ' — total carried from Jobber' : '') + '.</td></tr>';
  h += '</table><div class="totalrow"><span>Quote total</span><span>' + money(quoteTotal(q)) + '</span></div>';
  if(q.status === "Draft"){
    if(ROLE === "Owner"){
      h += '<p class="muted small">Draft — the price is not out the door yet. Sending a price is the Owner\'s call.</p>';
      h += '<button class="btn green block" id="qsend">Mark sent (Owner) →</button>';
      h += '<button class="btn ghost block" id="qedit">Edit draft</button>';
    } else {
      h += '<div class="empty" style="margin-top:10px">Draft. Only the Owner can set/change this price and mark it sent. Office can pick the work up once it is sent and the client approves.</div>';
    }
  }
  if(q.status === "Sent"){
    h += '<p class="muted small">Sent to the client — waiting on their approval. Record it here when they say yes (or no).</p>';
    h += '<button class="btn green block" id="qapprove">✓ Record client approval</button>';
    h += '<button class="btn red block" id="qdecline">Record declined</button>';
  }
  if(q.status === "Approved"){
    h += '<p class="muted small">Client approved. Convert it to a job when the work is a go.</p>';
    h += '<button class="btn gold block" id="qconvert">Convert to job →</button>';
  }
  if(q.status === "Declined"){
    h += '<p class="muted small">The client declined this quote.</p>';
  }
  if(q.status === "Converted"){
    const j = DB.jobs.find(x => x.quoteId === q.id);
    h += '<p class="muted small">This quote is now a job.</p>';
    if(j) h += '<button class="btn block" id="qgotojob">Open the job →</button>';
  }
  h += '</div>';
  if(quoteFormOpen && editingQuoteId === q.id) h += quoteFormHTML(q);
  return h;
}
function bindQuoteDetail(){
  const q = quoteById(selQuoteId);
  $("#backquotes").addEventListener("click", () => { selQuoteId = null; quoteFormOpen = false; render(); });
  if(!q) return;
  const sd = $("#qsend");
  if(sd) sd.addEventListener("click", () => { q.status = "Sent"; q.sentAt = todayStr(); saveDB(); render(); });
  const ap = $("#qapprove");
  if(ap) ap.addEventListener("click", () => { q.status = "Approved"; q.approvedAt = todayStr(); saveDB(); render(); });
  const dc = $("#qdecline");
  if(dc) dc.addEventListener("click", () => { q.status = "Declined"; saveDB(); render(); });
  const ed = $("#qedit");
  if(ed) ed.addEventListener("click", () => { quoteFormOpen = true; editingQuoteId = q.id; render(); });
  const cv = $("#qconvert");
  if(cv) cv.addEventListener("click", () => {
    const job = { id: uid("j"), quoteId: q.id, clientId: q.clientId, propertyId: q.propertyId,
      trade: q.trade, createdAt: todayStr(), stages: blankStages(), status: "Active", lateFlag: false };
    DB.jobs.push(job);
    q.status = "Converted";
    saveDB();
    selQuoteId = null; selJobId = job.id; TAB = "jobs";
    render(); window.scrollTo(0, 0);
  });
  const gj = $("#qgotojob");
  if(gj) gj.addEventListener("click", () => { const j = DB.jobs.find(x => x.quoteId === q.id); if(j){ selJobId = j.id; selQuoteId = null; TAB = "jobs"; render(); window.scrollTo(0, 0); } });
  if(quoteFormOpen && editingQuoteId === q.id) bindQuoteForm();
}

/* ---------------- JOBS ---------------- */
function jobPill(j){
  const st = jobDisplayStatus(j);
  if(st === "Completed") return '<span class="pill green">Completed</span>';
  if(st === "Late") return '<span class="pill red">Late</span>';
  return '<span class="pill gold">Active</span>';
}
function viewJobs(){
  let h = '<h2 class="view">Jobs</h2>';
  if(DB.jobs.length === 0){
    h += '<div class="empty">No jobs yet. Jobs are created by converting an approved quote.</div>';
  }
  DB.jobs.slice().reverse().forEach(j => {
    const c = clientById(j.clientId);
    const q = quoteById(j.quoteId);
    h += '<button class="rowitem" data-job="' + j.id + '"><span class="grow">' +
           '<span class="name">' + esc(j.title || ((c ? c.name : "Unknown client") + ' · ' + j.trade)) + '</span>' +
           '<div class="meta">' + (j.jobberNumber ? 'Job #' + esc(j.jobberNumber) + ' · ' : '') + (q ? q.number + ' · ' : '') + esc(c ? c.name : '') + ' · ' + esc(propertyLabel(c, j.propertyId)) + ' · ' + jobDoneCount(j) + ' of 5 stages done · invoiced ' + money(jobInvoiced(j)) + ' of ' + money(jobAmount(j)) + '</div></span>' +
           jobPill(j) + '<span class="chev">›</span></button>';
  });
  return h;
}
function bindJobs(){
  document.querySelectorAll("[data-job]").forEach(b => b.addEventListener("click", () => {
    selJobId = b.dataset.job; render(); window.scrollTo(0, 0);
  }));
}
function viewJobDetail(j){
  if(!j) return '<div class="empty">That job no longer exists.</div>';
  const c = clientById(j.clientId);
  const q = quoteById(j.quoteId);
  const amt = jobAmount(j), invd = jobInvoiced(j);
  let h = '<button class="backbtn" id="backjobs">← All jobs</button>';
  h += '<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap">' +
         '<div><div style="font-size:1.25rem;font-weight:800">' + esc(c ? c.name : "Unknown client") + '</div>' +
         '<div class="muted">' + esc(propertyLabel(c, j.propertyId)) + '</div></div>' +
         jobPill(j) + '</div>';
  h += '<div class="kv"><span class="k">Trade</span><span class="v">' + j.trade + '</span></div>';
  if(q) h += '<div class="kv"><span class="k">From quote</span><span class="v">' + q.number + '</span></div>';
  if(j.title) h += '<div class="kv"><span class="k">Job</span><span class="v">' + esc(j.title) + '</span></div>';
  if(j.jobberNumber) h += '<div class="kv"><span class="k">Jobber job #</span><span class="v">' + esc(j.jobberNumber) + '</span></div>';
  h += '<div class="kv"><span class="k">Job amount</span><span class="v">' + money(amt) + '</span></div>';
  h += '<div class="kv"><span class="k">Invoiced so far</span><span class="v">' + money(invd) + '</span></div>';
  h += '<div class="kv"><span class="k">Left to invoice</span><span class="v">' + money(Math.max(0, amt - invd)) + '</span></div>';
  h += '<div class="kv"><span class="k">Started</span><span class="v">' + fmtDate(j.createdAt) + '</span></div></div>';
  h += '<h3 class="sec">Stage tracker — tap a stage, set its date</h3>';
  STAGES.forEach(s => {
    const cur = (j.stages && j.stages[s.key]) || { status: "not", date: "" };
    h += '<div class="stage"><div class="top"><span class="nm">' + s.label + '</span>' +
           '<span class="pill ' + (cur.status === "done" ? "green" : (cur.status === "sched" ? "gold" : "grey")) + '">' +
           (cur.status === "done" ? "Done" : (cur.status === "sched" ? "Scheduled" : "Not started")) + '</span></div>' +
           '<div class="segbtns" data-stage="' + s.key + '">' +
             '<button data-st="not" class="' + (cur.status === "not" ? "on-not" : "") + '">Not started</button>' +
             '<button data-st="sched" class="' + (cur.status === "sched" ? "on-sched" : "") + '">Scheduled</button>' +
             '<button data-st="done" class="' + (cur.status === "done" ? "on-done" : "") + '">Done</button></div>' +
           '<input type="date" data-stagedate="' + s.key + '" value="' + esc(cur.date || "") + '" aria-label="' + s.label + ' date"></div>';
  });
  h += '<button class="btn gold block" id="newinv" style="margin-top:14px">＋ Create invoice from this job</button>';
  return h;
}
function bindJobDetail(){
  const j = jobById(selJobId);
  $("#backjobs").addEventListener("click", () => { selJobId = null; render(); });
  if(!j) return;
  document.querySelectorAll("[data-stage]").forEach(group => {
    const key = group.dataset.stage;
    group.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
      j.stages[key].status = b.dataset.st;
      if(key === "final" && b.dataset.st === "done") j.status = "Completed";
      saveDB(); render();
    }));
  });
  document.querySelectorAll("[data-stagedate]").forEach(inp => inp.addEventListener("change", () => {
    j.stages[inp.dataset.stagedate].date = inp.value;
    saveDB();
  }));
  $("#newinv").addEventListener("click", () => {
    invoiceFormOpen = true; invoiceFormJobId = j.id;
    selJobId = null; TAB = "invoices";
    render(); window.scrollTo(0, 0);
  });
}

/* ---------------- INVOICES ---------------- */
let invoiceFormOpen = false, invoiceFormJobId = "";
function invoicePill(inv){
  const st = displayInvoiceStatus(inv);
  if(st === "Paid") return '<span class="pill green">Paid</span>';
  if(st === "Past due") return '<span class="pill red">Past due</span>';
  if(st === "Draft") return '<span class="pill grey">Draft</span>';
  return '<span class="pill gold">Awaiting payment</span>';
}
function viewInvoices(){
  let h = '<h2 class="view">Invoices</h2>';
  h += '<button class="btn gold block" id="addinvoice">＋ New invoice</button>';
  if(invoiceFormOpen) h += invoiceFormHTML();
  h += '<div style="height:8px"></div>';
  if(DB.invoices.length === 0 && !invoiceFormOpen){
    h += '<div class="empty">No invoices yet. Invoices are created from jobs — in full, or as a stage draw.</div>';
  }
  DB.invoices.slice().reverse().forEach(inv => {

function refreshInvoiceAmount(){
  const j = jobById($("#if-job").value);

  let amt = total;
  if($("#if-basis").value === "draw"){
    const pct = Number($("#if-pct").value) || 0;
    amt = Math.round(total * pct) / 100;
  }
  $("#if-amount").textContent = money(amt);
  return amt;
}

    if(!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if(!data || !Array.isArray(data.clients) || !Array.isArray(data.quotes) || !Array.isArray(data.jobs) || !Array.isArray(data.invoices)){
          throw new Error("That file is not a Sharma CRM backup.");
        }
        DB.clients = data.clients; DB.quotes = data.quotes; DB.jobs = data.jobs; DB.invoices = data.invoices;
        DB.requests = Array.isArray(data.requests) ? data.requests : [];
        if(data.seq) DB.seq = data.seq;
        DB.importStamp = null;
        seedIfNeeded();
        saveDB();
        const ok = $("#setok");
        ok.textContent = "Backup imported. The data on this device has been replaced.";
        ok.style.display = "block";
      } catch(err){
        const er = $("#seterr");
        er.textContent = "Import failed: " + err.message;
        er.style.display = "block";
      }
    };
    reader.readAsText(f);
  });
  $("#switchrole").addEventListener("click", () => { $("#appshell").classList.add("hidden"); gateEl().classList.remove("hidden"); showRolePicker(); });
  $("#lockbtn").addEventListener("click", lockApp);
}

/* ---------------- boot ---------------- */
document.querySelectorAll("#tabbar button").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));
$("#settingsbtn").addEventListener("click", () => { TAB = "settings"; selClientId = selQuoteId = selJobId = selInvoiceId = selRequestId = null; render(); window.scrollTo(0, 0); });
loadDB();
seedIfNeeded();
saveDB();
loadExternalData();
if(DB.passHash){ showLock(); }
else { showSetup(); }
</script>
</body>
</html>
