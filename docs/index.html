<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>SHARMA360 CRM</title>
<script>
/* Appearance boot — Sanjay's standing rule for every Sharma app
   (2026-11-19): the app ALWAYS opens in LIGHT mode, even when the
   phone is in dark mode. Dark appears only through the in-app
   Appearance switch and is remembered on this device. The app never
   follows prefers-color-scheme. This runs before the stylesheet so
   the first paint is already correct. */
(function(){
  try {
    var t = localStorage.getItem("sharma-crm-appearance");
    document.documentElement.dataset.theme = (t === "dark") ? "dark" : "light";
  } catch(e){ document.documentElement.dataset.theme = "light"; }
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ LOCK / SETUP / ROLE (shown before the app) ============ -->
<div id="gate"></div>

<!-- ============ APP SHELL ============ -->
<div id="appshell" class="hidden">

  <!-- Sidebar (≥760px) -->
  <aside class="sidebar">
    <div class="wordmark">
      <div class="wm-name">SHARMA<span class="gold">360</span> · CRM</div>
      <div class="wm-sub">Sharma Electric &amp; HVAC</div>
    </div>
    <div class="snav-label">Menu</div>
    <nav class="snav">
      <button data-nav="home"><span class="ic">⌂</span><span class="lbl">Home</span></button>
      <button data-nav="clients"><span class="ic">👥</span><span class="lbl">Clients</span><span class="navcount" id="navcount-clients">0</span></button>
      <button data-nav="quotes"><span class="ic">📄</span><span class="lbl">Quotes</span><span class="navcount" id="navcount-quotes">0</span></button>
      <button data-nav="jobs"><span class="ic">🔧</span><span class="lbl">Jobs</span><span class="navcount" id="navcount-jobs">0</span></button>
      <button data-nav="invoices"><span class="ic">💲</span><span class="lbl">Invoices</span><span class="navcount" id="navcount-invoices">0</span></button>
      <button data-nav="more"><span class="ic">☰</span><span class="lbl">More</span></button>
    </nav>
    <div class="sidefoot">
      <span class="rolechip" id="rolechip">Owner</span>
      <button data-act="switchRole"><span>⇄</span> Switch role</button>
      <button data-act="lock"><span>🔒</span> Lock CRM</button>
    </div>
  </aside>

  <div class="mainwrap">
    <!-- Top bar: glass chrome. On root tabs the Large Title lives in
         the scroll content; this bar's inline title fades in on scroll
         (core.js toggles .scrolled / .has-largetitle). -->
    <header class="topbar" id="topbar">
      <div class="brand-mini">SHARMA<span class="gold">360</span></div>
      <div id="viewtitle">Home</div>
      <div class="spacer"></div>
      <div class="searchwrap">
        <span class="s-ic">🔍</span>
        <input type="search" id="globalsearch" placeholder="Search clients, quotes, jobs, invoices…" autocomplete="off" aria-label="Search the CRM">
        <div id="searchresults" class="hidden"></div>
      </div>
      <button class="btn gold" data-act="globalNew" aria-label="Create new">＋<span class="btn-new-lbl">&nbsp;New</span></button>
    </header>

    <main id="main"></main>
  </div>

  <!-- Floating glass tab bar (phone) -->
  <nav class="tabbar" id="tabbar">
    <span class="tab-sel" id="tabsel" aria-hidden="true"></span>
    <button data-nav="home"><span class="ic">⌂</span>Home</button>
    <button data-nav="clients"><span class="ic">👥</span>Clients</button>
    <button data-nav="quotes"><span class="ic">📄</span>Quotes</button>
    <button data-nav="jobs"><span class="ic">🔧</span>Jobs</button>
    <button data-nav="invoices"><span class="ic">💲</span>Invoices<span class="tabbadge hidden" id="tabbadge-invoices">0</span></button>
    <button data-nav="more"><span class="ic">☰</span>More</button>
  </nav>
</div>

<div id="modal-root"></div>
<div id="toast" role="status"></div>

<script src="core.js"></script>
<script src="view-home.js"></script>
<script src="view-clients.js"></script>
<script src="view-quotes.js"></script>
<script src="view-jobs.js"></script>
<script src="view-invoices.js"></script>
<script src="view-more.js"></script>
<script>
/* ---- integration bridges (Jarvis): cross-module deep links + action aliases ---- */
(function(){
  if(typeof ACTIONS === "undefined") return;
  if(ACTIONS.q_new && !ACTIONS.quote_new) ACTIONS.quote_new = ACTIONS.q_new;
  if(ACTIONS.cl_new && !ACTIONS.client_new) ACTIONS.client_new = ACTIONS.cl_new;
  if(ACTIONS.inv_new && !ACTIONS.invoice_new) ACTIONS.invoice_new = ACTIONS.inv_new;
  ACTIONS.openQuote = function(){
    if(typeof selQuoteId !== "undefined" && selQuoteId && ACTIONS.q_open) ACTIONS.q_open({ dataset: { id: selQuoteId } });
    else if(typeof render === "function") render();
  };
  ACTIONS.openInvoice = function(){
    const id = (typeof selInvoiceId !== "undefined") ? selInvoiceId : null;
    if(id && ACTIONS.inv_open) ACTIONS.inv_open({ getAttribute: function(){ return id; } });
    else if(typeof render === "function") render();
  };
  ACTIONS.openJob = function(){
    if(typeof selJobId !== "undefined" && selJobId) window.CRM_OPEN = { tab: "jobs", id: selJobId };
    if(typeof render === "function") render();
  };
  const baseRender = render;
  render = function(){
    const o = window.CRM_OPEN;
    if(o && o.tab === TAB){
      if(o.tab === "quotes" && ACTIONS.q_open){ window.CRM_OPEN = null; ACTIONS.q_open({ dataset: { id: o.id } }); return; }
      if(o.tab === "invoices" && ACTIONS.inv_open){ window.CRM_OPEN = null; ACTIONS.inv_open({ getAttribute: function(){ return o.id; } }); return; }
      if(o.tab === "clients"){ window.CRM_OPEN = null; try { selClientId = o.id; } catch(e){} }
      /* jobs: VIEWS.jobs consumes CRM_OPEN itself */
    }
    baseRender();
  };
})();
</script>
</body>
</html>
