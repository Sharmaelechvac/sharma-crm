<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SHARMA360 · CRM — Sharma Electric &amp; HVAC</title>
<style>
  :root{
    --navy:#264387; --navy-dark:#1b3163; --gold:#F0A846; --gold-dark:#c07f1d;
    --ink:#182430; --muted:#5a6b7d; --line:#d7dee6; --bg:#f2f5f9; --card:#ffffff;
    --green:#177245; --red:#b3261e; --amber:#96690a;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{font-size:18px;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg); color:var(--ink); line-height:1.45; padding-bottom:96px;}
  /* ---------- header ---------- */
  header.app{background:var(--navy); color:#fff; padding:16px 18px 14px; position:sticky; top:0; z-index:20;
       box-shadow:0 2px 10px rgba(27,49,99,.35);}
  header.app .row{display:flex; align-items:center; justify-content:space-between; gap:12px; max-width:860px; margin:0 auto;}
  header.app h1{font-size:1.35rem; margin:0; letter-spacing:.5px; font-weight:800;}
  header.app h1 .gold{color:var(--gold);}
  header.app .sub{font-size:.82rem; opacity:.85; margin-top:2px;}
  .hbtns{display:flex; gap:8px; align-items:center;}
  .rolebadge{background:var(--gold); color:#23180a; font-weight:700; font-size:.78rem;
       padding:6px 12px; border-radius:999px; white-space:nowrap;}
  .iconbtn{background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.35);
       border-radius:10px; min-width:48px; min-height:48px; font-size:1.15rem; cursor:pointer;}
  /* ---------- layout ---------- */
  main{max-width:860px; margin:0 auto; padding:16px 14px 8px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
       padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(24,36,48,.05);}
  h2.view{font-size:1.3rem; margin:4px 0 12px; color:var(--navy-dark);}
  h3.sec{font-size:1.05rem; margin:18px 0 8px; color:var(--navy-dark);}
  .muted{color:var(--muted);} .small{font-size:.85rem;}
  .empty{padding:22px 16px; text-align:center; color:var(--muted); border:1.5px dashed var(--line);
       border-radius:var(--radius); background:#fff; margin-bottom:14px;}
  /* ---------- buttons & forms ---------- */
  button, .btn{font:inherit; cursor:pointer;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:52px;
       padding:12px 20px; border-radius:12px; border:1px solid var(--navy); background:var(--navy);
       color:#fff; font-weight:700; text-decoration:none; font-size:1rem;}
  .btn.gold{background:var(--gold); border-color:var(--gold-dark); color:#23180a;}
  .btn.ghost{background:#fff; color:var(--navy); border-color:var(--navy);}
  .btn.green{background:var(--green); border-color:var(--green);}
  .btn.red{background:#fff; color:var(--red); border-color:var(--red);}
  .btn.block{display:flex; width:100%; margin:8px 0;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  label.f{display:block; font-weight:600; margin:14px 0 6px; font-size:.95rem;}
  input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],
  input[type=password],select,textarea{
       width:100%; font:inherit; padding:13px 12px; min-height:52px; border:1.5px solid var(--line);
       border-radius:10px; background:#fff; color:var(--ink);}
  textarea{min-height:84px; resize:vertical;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--navy); outline-offset:1px; border-color:var(--navy);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:560px){ .grid2{grid-template-columns:1fr;} }
  /* ---------- list rows ---------- */
  .rowitem{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:#fff;
       border:1px solid var(--line); border-radius:var(--radius); padding:15px 16px; margin-bottom:10px;
       min-height:64px; cursor:pointer; color:var(--ink); font:inherit;}
  .rowitem:active{background:#eef3fa;}
  .rowitem .grow{flex:1; min-width:0;}
  .rowitem .name{font-weight:700; font-size:1.02rem; overflow:hidden; text-overflow:ellipsis;}
  .rowitem .meta{color:var(--muted); font-size:.85rem; margin-top:2px;}
  .rowitem .amt{font-weight:800; white-space:nowrap;}
  .chev{color:var(--muted); font-size:1.3rem;}
  .badge{display:inline-block; font-size:.72rem; font-weight:700; letter-spacing:.4px; padding:4px 10px;
       border-radius:999px; background:#e4ebf5; color:var(--navy-dark); text-transform:uppercase; white-space:nowrap;}
  .badge.gold{background:#fdeecb; color:#7a5205;}
  .badge.green{background:#d9efe2; color:var(--green);}
  .badge.red{background:#f9dcd9; color:var(--red);}
  .badge.grey{background:#e8edf2; color:var(--muted);}
  .tag-draft{display:inline-block; background:var(--red); color:#fff; font-weight:800; font-size:.78rem;
       padding:5px 12px; border-radius:8px; letter-spacing:.4px;}
  /* ---------- today stats ---------- */
  .stats{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px;}
  @media (min-width:640px){ .stats{grid-template-columns:repeat(4,1fr);} }
  .stat{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:16px 14px; text-align:center;}
  .stat .n{font-size:1.9rem; font-weight:800; color:var(--navy); line-height:1.1;}
  .stat .l{font-size:.82rem; color:var(--muted); margin-top:4px; font-weight:600;}
  .stat .s{font-size:.85rem; font-weight:700; color:var(--ink); margin-top:2px;}
  /* ---------- stages ---------- */
  .stage{border:1px solid var(--line); border-radius:12px; padding:13px 14px; margin-bottom:10px; background:#fff;}
  .stage .top{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .stage .nm{font-weight:700;}
  .segbtns{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
  .segbtns button{flex:1; min-height:48px; padding:9px 6px; border-radius:10px; border:1.5px solid var(--line);
       background:#fff; font-weight:600; font-size:.88rem; color:var(--muted);}
  .segbtns button.on-not{background:#e8edf2; color:var(--ink); border-color:var(--muted);}
  .segbtns button.on-sched{background:#fdeecb; color:#7a5205; border-color:var(--gold-dark);}
  .segbtns button.on-done{background:var(--green); color:#fff; border-color:var(--green);}

/* ---------------- utilities ---------------- */
const $ = (sel, el) => (el || document).querySelector(sel);
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtDate(iso){
  if(!iso) return "—";
  const p = String(iso).split("-");
  if(p.length !== 3) return esc(iso);
  return MONTHS[parseInt(p[1],10)-1] + " " + parseInt(p[2],10) + ", " + p[0];
}
function daysBetween(fromIso, toIso){
  const a = new Date(fromIso + "T12:00:00"), b = new Date(toIso + "T12:00:00");
  return Math.round((b - a) / 86400000);
}
const USD = new Intl.NumberFormat("en-US", {style:"currency", currency:"USD"});
function money(n){ return USD.format(Number(n) || 0); }
function typeLabel(t){ t = String(t || "builder").toLowerCase(); return t === "builder" ? "Builder" : (t === "homeowner" ? "Homeowner" : (t === "commercial" ? "Commercial" : "Builder")); }

/* ---------------- data store ---------------- */
let DB = null;
function blankDB(){
  return {
    passHash: null,
    clients: [],
    quotes: [],
    jobs: [],
    invoices: [],
    seq: { quote: 1001, invoice: 1001, client: 41 }
  };
}
function loadDB(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ DB = JSON.parse(raw); return; }
  } catch(e){ /* corrupted storage falls through to a fresh DB */ }
  DB = blankDB();
}
function saveDB(){ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }
function seedIfNeeded(){
  if(!DB.clients || DB.clients.length === 0){
    DB.clients = JSON.parse(JSON.stringify(SEED_CLIENTS));
  }
  if(!DB.quotes) DB.quotes = [];
  if(!DB.jobs) DB.jobs = [];
  if(!DB.invoices) DB.invoices = [];
  if(!DB.seq) DB.seq = { quote: 1001, invoice: 1001, client: 41 };
  DB.clients.forEach(c => {
    if(!("phone" in c)) c.phone = "";
    if(!("email" in c)) c.email = "";
    if(!("billingNotes" in c)) c.billingNotes = "";
    if(!Array.isArray(c.contacts)) c.contacts = [];
    if(!Array.isArray(c.properties)) c.properties = [];
  });
}

/* ---------------- passcode (SHA-256) ---------------- */
async function sha256(text){
  if(window.crypto && crypto.subtle){
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
  }
  /* Fallback for non-secure contexts only (rare): a simple non-crypto hash. */
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i = 0; i < text.length; i++){
    const ch = text.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (h2 >>> 0).toString(16).padStart(8,"0") + (h1 >>> 0).toString(16).padStart(8,"0");
}

    const a = $("#pc1").value, b = $("#pc2").value, err = $("#gateerr");
    if(a.length < 4){ err.textContent = "Passcode needs at least 4 characters."; err.style.display = "block"; return; }
    if(a !== b){ err.textContent = "The two passcodes do not match."; err.style.display = "block"; return; }
    DB.passHash = await sha256(a);
    seedIfNeeded();
    saveDB();
    UNLOCKED = true;
    showRolePicker();
  });
}
function showLock(){
  gateHTML(
    '<h2 class="view" style="text-align:center">Locked</h2>' +
    '<p class="muted small">Enter your passcode to open the CRM.</p>' +
    '<div class="err" id="gateerr"></div>' +
    '<label class="f" style="text-align:left">Passcode</label>' +
    '<input type="password" id="pc" inputmode="numeric" autocomplete="current-password" placeholder="Passcode">' +
    '<button class="btn gold block" id="unlockgo" style="margin-top:20px">Unlock</button>'
  );
  const input = $("#pc");
  input.focus();
  const tryUnlock = async () => {
    const h = await sha256(input.value);
    if(h === DB.passHash){
      UNLOCKED = true;
      if(sessionStorage.getItem(SS_ROLE)){ ROLE = sessionStorage.getItem(SS_ROLE); enterApp(); }
      else showRolePicker();
    } else {
      const err = $("#gateerr");
      err.textContent = "That passcode is not right. Try again.";
      err.style.display = "block";
      input.value = "";
    }
  };
  $("#unlockgo").addEventListener("click", tryUnlock);
  input.addEventListener("keydown", e => { if(e.key === "Enter") tryUnlock(); });
}
function showRolePicker(){
  gateHTML(
    '<h2 class="view" style="text-align:center">Who is using the CRM?</h2>' +
    '<p class="muted small">Your role is remembered for this session only.</p>' +
    '<button class="rolebtn" id="role-owner"><span class="ic">👑</span><span><span class="t">Owner</span><br><span class="d">Sanjay — full access, including approving quote prices</span></span></button>' +

/* ---------------- app state & lookups ---------------- */
let TAB = "today";
let selClientId = null, selQuoteId = null, selJobId = null, selInvoiceId = null;
let clientSearch = "";

function clientById(id){ return DB.clients.find(c => c.id === id) || null; }
function quoteById(id){ return DB.quotes.find(q => q.id === id) || null; }
function jobById(id){ return DB.jobs.find(j => j.id === id) || null; }
function invoiceById(id){ return DB.invoices.find(i => i.id === id) || null; }
function propertyById(client, pid){
  if(!client || !pid) return null;
  return (client.properties || []).find(p => p.id === pid) || null;
}
function propertyLabel(client, pid){
  const p = propertyById(client, pid);
  if(!p) return "No property selected";
  if(client && String(client.type).toLowerCase() === "builder"){
    return (p.community || "—") + (p.address ? " · " + p.address : "");
  }
  return p.address || "—";
}
function quoteTotal(q){
  return (q.lines || []).reduce((sum, l) => sum + (Number(l.qty) || 0) * (Number(l.price) || 0), 0);
}
const STAGES = [
  { key: "tug",         label: "TUG" },
  { key: "underground", label: "Underground" },
  { key: "roughin",     label: "Rough-in" },
  { key: "trim",        label: "Trim" },
  { key: "final",       label: "Final" }
];
function blankStages(){
  const s = {};
  STAGES.forEach(st => { s[st.key] = { status: "not", date: "" }; });
  return s;
}
function jobStatus(job){
  return (job.stages && job.stages.final && job.stages.final.status === "done") ? "Completed" : "Active";
}
function jobDoneCount(job){
  return STAGES.filter(st => job.stages && job.stages[st.key] && job.stages[st.key].status === "done").length;
}
function invoicePastDue(inv){
  if(inv.status !== "Sent") return false;
  const from = inv.sentAt || inv.createdAt;
  return daysBetween(from, todayStr()) > 30;
}
function displayInvoiceStatus(inv){
  if(inv.status === "Sent" && invoicePastDue(inv)) return "Past due";
  return inv.status;
}

/* ---------------- app entry / tab routing ---------------- */
function enterApp(){
  gateEl().classList.add("hidden");
  gateEl().innerHTML = "";
  $("#appshell").classList.remove("hidden");
  $("#rolebadge").textContent = ROLE;
  render();
  window.scrollTo(0, 0);
}
function go(tab){
  TAB = tab;
  if(tab !== "clients") selClientId = null;
  if(tab !== "quotes") selQuoteId = null;
  if(tab !== "jobs") selJobId = null;
  if(tab !== "invoices") selInvoiceId = null;
  render();
  window.scrollTo(0, 0);
}
function render(){
  document.querySelectorAll("#tabbar button").forEach(b => {
    b.classList.toggle("on", b.dataset.tab === TAB);
  });
  const m = $("#main");
  if(TAB === "today") m.innerHTML = viewToday();
  else if(TAB === "clients") m.innerHTML = selClientId ? viewClientDetail(clientById(selClientId)) : viewClients();
  else if(TAB === "quotes") m.innerHTML = selQuoteId ? viewQuoteDetail(quoteById(selQuoteId)) : viewQuotes();
  else if(TAB === "jobs") m.innerHTML = selJobId ? viewJobDetail(jobById(selJobId)) : viewJobs();
  else if(TAB === "invoices") m.innerHTML = selInvoiceId ? viewInvoiceDetail(invoiceById(selInvoiceId)) : viewInvoices();
  else if(TAB === "settings") m.innerHTML = viewSettings();
  bindView();
}
function bindView(){
  if(TAB === "today") bindToday();
  else if(TAB === "clients") { selClientId ? bindClientDetail() : bindClients(); }
  else if(TAB === "quotes") { selQuoteId ? bindQuoteDetail() : bindQuotes(); }
  else if(TAB === "jobs") { selJobId ? bindJobDetail() : bindJobs(); }
  else if(TAB === "invoices") { selInvoiceId ? bindInvoiceDetail() : bindInvoices(); }
  else if(TAB === "settings") bindSettings();
}

/* ---------------- TODAY ---------------- */
function followUps(){
  const t = todayStr(), out = [];
  DB.quotes.forEach(q => {
    if(q.status === "Draft"){
      const age = daysBetween(q.createdAt, t);
      if(age > 7){
        const c = clientById(q.clientId);
        out.push({ kind: "quote", id: q.id, red: false,
          text: "Quote " + q.number + " — " + (c ? c.name : "Unknown client") + " (" + q.trade + ")",
          sub: "Still a draft after " + age + " days · " + money(quoteTotal(q)) });
      }
    }
  });
  DB.invoices.forEach(inv => {
    if(invoicePastDue(inv)){
      const c = clientById(inv.clientId);
      const age = daysBetween(inv.sentAt || inv.createdAt, t);
      out.push({ kind: "invoice", id: inv.id, red: true,
        text: "Invoice " + inv.number + " — " + (c ? c.name : "Unknown client"),
        sub: "Past due · sent " + age + " days ago · " + money(inv.amount) + " unpaid" });
    }
  });
  return out;
}
function viewToday(){
  const drafts = DB.quotes.filter(q => q.status === "Draft");
  const activeJobs = DB.jobs.filter(j => jobStatus(j) === "Active");
  const unpaid = DB.invoices.filter(i => i.status === "Sent");
  const unpaidTotal = unpaid.reduce((s, i) => s + (Number(i.amount) || 0), 0);
  const ups = followUps();
  let h = '<h2 class="view">Today</h2><div class="stats">';
  h += '<div class="stat"><div class="n">' + DB.clients.length + '</div><div class="l">Clients</div></div>';
  h += '<div class="stat"><div class="n">' + drafts.length + '</div><div class="l">Draft quotes</div></div>';
  h += '<div class="stat"><div class="n">' + activeJobs.length + '</div><div class="l">Active jobs</div></div>';
  h += '<div class="stat"><div class="n">' + unpaid.length + '</div><div class="l">Unpaid invoices</div><div class="s">' + money(unpaidTotal) + '</div></div>';
  h += '</div>';
  h += '<h3 class="sec">Follow-ups due (' + ups.length + ')</h3>';
  if(ups.length === 0){
    h += '<div class="empty">No follow-ups due. Draft quotes older than 7 days and past-due invoices will show up here.</div>';
  } else {
    ups.forEach(u => {
      h += '<button class="rowitem followup' + (u.red ? " red" : "") + '" data-follow="' + u.kind + ':' + u.id + '">' +
             '<span class="grow"><span class="name">' + esc(u.text) + '</span><div class="meta">' + esc(u.sub) + '</div></span>' +
             '<span class="chev">›</span></button>';
    });
  }
  h += '<div class="card"><div class="kv"><span class="k">Approved quotes waiting to become jobs</span><span class="v">' +
       DB.quotes.filter(q => q.status === "Approved").length + '</span></div>' +
       '<div class="kv"><span class="k">Completed jobs</span><span class="v">' +
       DB.jobs.filter(j => jobStatus(j) === "Completed").length + '</span></div>' +
       '<div class="kv"><span class="k">Invoices still in draft (not sent)</span><span class="v">' +
       DB.invoices.filter(i => i.status === "Draft").length + '</span></div></div>';
  return h;
}
function bindToday(){
  document.querySelectorAll("[data-follow]").forEach(b => b.addEventListener("click", () => {
    const parts = b.dataset.follow.split(":");
    if(parts[0] === "quote"){ selQuoteId = parts[1]; TAB = "quotes"; }
    else { selInvoiceId = parts[1]; TAB = "invoices"; }
    render(); window.scrollTo(0, 0);
  }));
}

      notes: $("#cf-notes").value.trim()
    };

function readLineRows(){
  const rows = [];
  document.querySelectorAll("#qf-lines .linerow").forEach(r => {
    rows.push({ desc: $(".li-desc", r).value.trim(), qty: Number($(".li-qty", r).value) || 0, price: Number($(".li-price", r).value) || 0 });
  });
  return rows;
}
function refreshQuoteTotal(){
  const t = readLineRows().reduce((s, l) => s + l.qty * l.price, 0);
  const el = $("#qf-total");
  if(el) el.textContent = money(t);
}
function bindQuoteForm(){
  const q = editingQuoteId ? quoteById(editingQuoteId) : null;
  fillPropertyOptions($("#qf-client").value, q ? q.propertyId : "");
  $("#qf-client").addEventListener("change", e => fillPropertyOptions(e.target.value, ""));
  $("#qf-addline").addEventListener("click", () => {
    $("#qf-lines").insertAdjacentHTML("beforeend", lineRowHTML(null));
    wireLineRows();
  });
  wireLineRows();
  $("#qfcancel").addEventListener("click", () => { quoteFormOpen = false; editingQuoteId = null; render(); });
  $("#qfsave").addEventListener("click", () => {
    const err = $("#qferr");
    const clientId = $("#qf-client").value;
    const trade = $("#qf-trade").value;
    const lines = readLineRows().filter(l => l.desc || l.price);
    if(!clientId){ err.textContent = "Pick the client first."; err.style.display = "block"; return; }
    if(!trade){ err.textContent = "Trade is required — Electric or HVAC. One trade per quote, always."; err.style.display = "block"; return; }
    if(lines.length === 0){ err.textContent = "Add at least one line item."; err.style.display = "block"; return; }
    if(editingQuoteId){
      Object.assign(quoteById(editingQuoteId), { clientId: clientId, propertyId: $("#qf-property").value, trade: trade, lines: lines });
    } else {
      const nq = { id: uid("q"), number: "Q-" + (DB.seq.quote++), clientId: clientId,
        propertyId: $("#qf-property").value, trade: trade, lines: lines,
        status: "Draft", createdAt: todayStr() };
      DB.quotes.push(nq);
      selQuoteId = nq.id;

    render();
  });
}
function wireLineRows(){
  document.querySelectorAll("#qf-lines .linerow").forEach(r => {

    r.querySelectorAll("input").forEach(inp => inp.oninput = refreshQuoteTotal);

    });

function refreshInvoiceAmount(){
  const j = jobById($("#if-job").value);
  const q = j ? quoteById(j.quoteId) : null;
  const total = q ? quoteTotal(q) : 0;
  let amt = total;
  if($("#if-basis").value === "draw"){
    const pct = Number($("#if-pct").value) || 0;
    amt = Math.round(total * pct) / 100;
  }
  $("#if-amount").textContent = money(amt);
  return amt;
}
function bindInvoiceForm(){
  const upd = () => {
    $("#if-drawwrap").classList.toggle("hidden", $("#if-basis").value !== "draw");
    refreshInvoiceAmount();

    $("#if-job").addEventListener("change", upd);
    $("#if-basis").addEventListener("change", upd);
    $("#if-pct").addEventListener("input", refreshInvoiceAmount);
    upd();
  }
  $("#ifcancel").addEventListener("click", () => { invoiceFormOpen = false; invoiceFormJobId = ""; render(); });

function bindSettings(){
  $("#exportbtn").addEventListener("click", () => {
    const data = { clients: DB.clients, quotes: DB.quotes, jobs: DB.jobs, invoices: DB.invoices, seq: DB.seq };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "sharma-crm-backup-" + todayStr() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });
  $("#importfile").addEventListener("change", e => {
    const f = e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if(!data || !Array.isArray(data.clients) || !Array.isArray(data.quotes) || !Array.isArray(data.jobs) || !Array.isArray(data.invoices)){
          throw new Error("That file is not a Sharma CRM backup.");
        }
        DB.clients = data.clients; DB.quotes = data.quotes; DB.jobs = data.jobs; DB.invoices = data.invoices;
        if(data.seq) DB.seq = data.seq;
        seedIfNeeded();
        saveDB();
        const ok = $("#setok");
        ok.textContent = "Backup imported. The data on this device has been replaced.";
        ok.style.display = "block";
      } catch(err){
        const er = $("#seterr");
        er.textContent = "Import failed: " + err.message;
        er.style.display = "block";
      }
    };
    reader.readAsText(f);
  });
  $("#switchrole").addEventListener("click", () => { $("#appshell").classList.add("hidden"); gateEl().classList.remove("hidden"); showRolePicker(); });
  $("#lockbtn").addEventListener("click", lockApp);
}

/* ---------------- boot ---------------- */
document.querySelectorAll("#tabbar button").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));
$("#settingsbtn").addEventListener("click", () => { TAB = "settings"; selClientId = selQuoteId = selJobId = selInvoiceId = null; render(); window.scrollTo(0, 0); });
loadDB();
if(DB.passHash){ showLock(); }
else { showSetup(); }
</script>
</body>
</html>
